<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>کُره یدک | ورود مدیر</title>
<style>
:root {
  --bg-main: #0b0f19;
  --bg-card: rgba(30, 41, 59, 0.7);
  --border-color: rgba(255, 255, 255, 0.1);
  --primary: #3b82f6;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --danger: #ef4444;
  --glass-blur: blur(16px);
}

body {
  font-family: system-ui, -apple-system, sans-serif;
  margin: 0;
  background-color: var(--bg-main);
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}

.login-container {
  width: min(400px, 90%);
  background: var(--bg-card);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border-color);
  border-radius: 20px;
  padding: 35px 30px;
  box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
  animation: fadeInUp 0.5s ease-out forwards;
}

.header-title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-bottom: 10px;
  font-size: 22px;
  font-weight: 700;
}

.icon {
  width: 24px;
  height: 24px;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
}

.subtitle {
  text-align: center;
  font-size: 13px;
  color: var(--text-muted);
  margin-bottom: 25px;
}

.form-input {
  width: 100%;
  background: rgba(15, 23, 42, 0.6);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 14px;
  border-radius: 12px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  transition: all 0.2s ease;
  margin-bottom: 15px;
  box-sizing: border-box;
}

.form-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
}

.input-error {
  border-color: var(--danger) !important;
  background-color: rgba(239, 68, 68, 0.08) !important;
}

.password-wrap { position: relative; }
.eye-btn {
  position: absolute; left: 12px; top: 22px; transform: translateY(-50%);
  background: none; border: none; cursor: pointer; color: var(--text-muted);
  display: flex; align-items: center; justify-content: center;
}
.eye-btn:hover { color: var(--text-main); }

.btn-primary {
  width: 100%; padding: 14px; background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4); }

.err-msg { color: var(--danger); font-size: 13px; min-height: 20px; margin-bottom: 15px; text-align: center; }

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="login-container">
  <div class="header-title">
    <svg class="icon" style="color:var(--primary);" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span>ورود به سامانه</span>
  </div>
  <p class="subtitle">جهت دسترسی به مدیریت کُره یدک وارد شوید.</p>
  
  <input id="loginUsername" class="form-input" placeholder="نام کاربری" autocomplete="username">
  
  <div class="password-wrap">
    <input id="loginPassword" type="password" class="form-input" placeholder="رمز عبور" autocomplete="current-password">
    <button type="button" class="eye-btn" onclick="togglePass('loginPassword', this)">
      <svg class="icon" style="width:20px;height:20px" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
  
  <div id="loginError" class="err-msg"></div>
  <button class="btn-primary" onclick="login()">ورود به پنل</button>
</div>

<script>
const API_BASE = "";
const TOKEN_KEY = "koreyadak_token";

// اگر کاربر از قبل توکن معتبر داشت، مستقیم برود به صفحه ادمین
async function checkSession() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) return;
  
  try {
    const res = await fetch(API_BASE + "/api/auth/me", {
      headers: { "Authorization": "Bearer " + token }
    });
    if (res.ok) {
      window.location.replace("/admin");
    } else {
      localStorage.removeItem(TOKEN_KEY);
    }
  } catch (e) {
    console.error(e);
  }
}
checkSession();

function togglePass(id, btn) {
  const el = document.getElementById(id);
  if (el.type === "password") { 
    el.type = "text"; 
    btn.innerHTML = '<svg class="icon" style="width:20px;height:20px" viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>'; 
  } else { 
    el.type = "password"; 
    btn.innerHTML = '<svg class="icon" style="width:20px;height:20px" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>'; 
  }
}

document.querySelectorAll('input').forEach(input => {
  input.addEventListener('input', () => {
    input.classList.remove('input-error');
    document.getElementById("loginError").textContent = "";
  });
});

async function login() {
  const uInput = document.getElementById("loginUsername");
  const pInput = document.getElementById("loginPassword");
  const err = document.getElementById("loginError");
  
  let isValid = true;
  if (!uInput.value.trim()) { uInput.classList.add("input-error"); isValid = false; }
  if (!pInput.value.trim()) { pInput.classList.add("input-error"); isValid = false; }
  if (!isValid) return;

  try {
    const response = await fetch(API_BASE + "/api/auth/login", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ username: uInput.value.trim(), password: pInput.value })
    });
    
    const data = await response.json();
    
    if (!response.ok) {
      throw new Error(data.detail || "نام کاربری یا رمز عبور اشتباه است.");
    }
    
    localStorage.setItem(TOKEN_KEY, data.token);
    window.location.replace("/admin"); // پس از لاگین موفق به پنل میرود
    
  } catch (e) { 
    err.textContent = e.message; 
  }
}

// لاگین با زدن دکمه Enter
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") login();
});
</script>
</body>
</html>
