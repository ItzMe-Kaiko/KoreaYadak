<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>کُره یدک | سیستم گزارش‌گیری</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
    if (!localStorage.getItem("koreyadak_token")) {
      window.location.replace("/login");
    }
    </script>

    <style>
       @import url('https://cdn.fontcdn.ir/Font/Persian/Vazir/Vazir.css');
    
        html, body {
            background-color: #0b0f19 !important;
            color: #f8fafc;
            margin: 0;
        }
    
        :root {
            --bg-main: #0b0f19;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-sidebar: rgba(24, 34, 52, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --glass-blur: blur(16px);
        }

        body.light {
            --bg-main: #f1f5f9;
            --bg-card: rgba(255, 255, 255, 0.85);
            --bg-sidebar: rgba(255, 255, 255, 0.9);
            --border-color: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --glass-blur: blur(12px);
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'Vazir', system-ui, -apple-system, sans-serif;
            margin: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            transition: background-color 0.4s ease, color 0.4s ease;
            overflow-x: hidden;
        }

        /* Hero Shader */
        .hero {
            position: relative;
            height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            overflow: hidden;
        }

        #shader-canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            backdrop-filter: blur(4px);
            padding: 12px 24px;
            border-radius: 16px;
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.08);
            animation: fadeInDown 0.6s ease-out;
        }

        .hero h1 {
            font-size: 24px; font-weight: 800; margin: 0 0 4px;
            background: linear-gradient(135deg, #ffffff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.6;
            padding-bottom: 5px;
        }

        /* Layout */
        .app-layout {
            display: flex;
            max-width: 1400px;
            margin: 20px auto;
            gap: 20px;
            padding: 0 15px;
            position: relative;
            z-index: 2;
        }

        .sidebar {
            width: 250px;
            background: var(--bg-sidebar);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            height: fit-content;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; border-radius: 10px;
            color: var(--text-muted); background: transparent;
            border: 1px solid transparent; width: 100%; text-align: right;
            font-size: 13px; cursor: pointer; transition: all 0.25s ease;
            text-decoration: none;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(99, 102, 241, 0.12);
            border-color: rgba(99, 102, 241, 0.3);
            color: #818cf8; transform: translateX(-3px);
        }

        .main-content { flex: 1; min-width: 0; }

        .glass-card {
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
        }

        /* Theme Toggle Switch */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; inset: 0;
            background-color: #334155; transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px;
            left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(20px); }

        .form-input-custom {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 13px;
            outline: none;
            transition: all 0.2s;
        }
        body.light .form-input-custom {
            background: #ffffff;
            color: #0f172a;
        }
        .form-input-custom:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        /* Genuine Badge Effect */
        .badge-genuine {
            background: linear-gradient(90deg, #d97706 0%, #fbbf24 30%, #fffbeb 50%, #fbbf24 70%, #d97706 100%);
            background-size: 200% auto;
            color: #451a03;
            font-weight: 800;
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 8px;
            border: 1px solid rgba(251, 191, 36, 0.6);
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.3);
            animation: goldShimmer 3s linear infinite;
            text-transform: uppercase;
            display: inline-block;
        }
        @keyframes goldShimmer {
            to { background-position: -200% center; }
        }

        /* Modern Loading Bar Animation */
        @keyframes loadingBar {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        .animate-loading-bar {
            animation: loadingBar 1.4s ease-in-out infinite;
            width: 60%;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 850px) {
            .app-layout { flex-direction: column; }
            .sidebar { width: 100%; }
        }

        /* Print Optimization */
        @media print {
            .sidebar, .hero, .print-hide { display: none !important; }
            .app-layout { margin: 0; padding: 0; max-width: 100%; }
            .glass-card { box-shadow: none; border: none; background: transparent; }
            body, html { background: white !important; color: black !important; }
            * { text-shadow: none !important; }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #ddd; padding: 8px; text-align: right; }
        }
    </style>
</head>
<body class="text-sm">

    <!-- شیدر هدر بالایی -->
    <div class="hero">
        <canvas id="shader-canvas"></canvas>
        <div class="hero-content">
            <h1>کُره یدک | سیستم گزارش‌گیری</h1>
            <p class="text-xs text-gray-300">دریافت گزارشات جامع انبار و وضعیت مالی</p>
        </div>
    </div>

    <div class="app-layout">
        <!-- منوی راست -->
        <aside class="sidebar">
            <div class="flex items-center gap-3 pb-3 mb-2 border-b border-gray-700/50">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg">
                    <i class="fa-solid fa-chart-pie text-lg"></i>
                </div>
                <div>
                    <div class="font-bold">کُره یدک</div>
                    <div class="text-xs text-gray-400">پنل گزارش‌ها</div>
                </div>
            </div>

            <a class="nav-item" href="/admin">
                <i class="fa-solid fa-boxes-stacked"></i> مدیریت قطعات
            </a>
            <a class="nav-item" href="/admin/buy">
                <i class="fa-solid fa-cart-shopping"></i> فاکتور خرید
            </a>
            <a class="nav-item" href="/admin/sell">
                <i class="fa-solid fa-file-invoice"></i> فاکتور فروش
            </a>
            <a class="nav-item active" href="/admin/report">
                <i class="fa-solid fa-chart-pie text-indigo-400"></i> گزارش‌ها
            </a>
        </aside>

        <!-- محتوای اصلی -->
        <main class="main-content">
            
            <!-- پنل تنظیمات گزارش -->
            <div class="glass-card p-5 mb-6 print-hide relative overflow-hidden">
                <!-- نوار لودینگ مدرن بالای کارت -->
                <div id="topProgressBar" class="absolute top-0 left-0 right-0 h-1 bg-indigo-950/40 overflow-hidden hidden">
                    <div class="h-full bg-gradient-to-r from-indigo-500 via-emerald-400 to-blue-500 animate-loading-bar rounded-full shadow-[0_0_12px_rgba(99,102,241,0.8)]"></div>
                </div>

                <div class="flex justify-between items-center mb-5 border-b border-gray-700/50 pb-4">
                    <h2 class="text-lg font-bold text-indigo-400 flex items-center gap-2">
                        <i class="fa-solid fa-sliders"></i> پارامترهای گزارش
                    </h2>
                    <div class="flex items-center gap-3">
                        <span class="text-xs text-gray-400">حالت تاریک</span>
                        <label class="switch">
                            <input type="checkbox" id="darkToggle" checked>
                            <span class="slider"></span>
                        </label>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-5">
                    <!-- نوع گزارش -->
                    <div class="relative">
                        <label class="block text-xs text-gray-400 mb-1">نوع گزارش</label>
                        <i class="fa-solid fa-list absolute right-3 top-[34px] text-gray-500 text-xs"></i>
                        <select id="reportType" class="w-full form-input-custom pr-9 appearance-none cursor-pointer">
                            <option value="out_of_stock">قطعات ناموجود در انبار</option>
                            <option value="in_stock">قطعات موجود در انبار</option>
                            <option value="unpaid_sell">فاکتورهای تسویه نشده (فروش)</option>
                            <option value="paid_sell">فاکتورهای تسویه شده (فروش)</option>
                            <option value="unpaid_buy">فاکتورهای تسویه نشده (خرید)</option>
                            <option value="paid_buy">فاکتورهای تسویه شده (خرید)</option>
                            <option value="paid_all">فاکتورهای تسویه شده (کل)</option>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute left-3 top-[34px] text-gray-500 text-xs pointer-events-none"></i>
                    </div>

                    <!-- از تاریخ -->
                    <div class="relative">
                        <label class="block text-xs text-gray-400 mb-1">از تاریخ</label>
                        <i class="fa-solid fa-calendar-days absolute right-3 top-[34px] text-gray-500 text-xs"></i>
                        <input type="text" id="fromDate" maxlength="8" placeholder="YY/MM/DD" dir="ltr" oninput="formatSearchDate(event)" class="w-full form-input-custom pr-9 text-right font-mono">
                    </div>

                    <!-- تا تاریخ -->
                    <div class="relative">
                        <label class="block text-xs text-gray-400 mb-1">تا تاریخ</label>
                        <i class="fa-solid fa-calendar-days absolute right-3 top-[34px] text-gray-500 text-xs"></i>
                        <input type="text" id="toDate" maxlength="8" placeholder="YY/MM/DD" dir="ltr" oninput="formatSearchDate(event)" class="w-full form-input-custom pr-9 text-right font-mono">
                    </div>
                    
                    <!-- جستجوی کلمه کلیدی -->
                    <div class="relative">
                        <label class="block text-xs text-gray-400 mb-1">کلمه کلیدی (اختیاری)</label>
                        <i class="fa-solid fa-search absolute right-3 top-[34px] text-gray-500 text-xs"></i>

                <!-- دکمه‌های اکشن -->
                <div class="flex flex-wrap gap-3 justify-end mt-2 pt-4 border-t border-gray-700/50">
                    <button onclick="fetchReportData()" class="bg-slate-700 hover:bg-slate-600 text-white px-5 py-2.5 rounded-xl font-bold transition flex items-center gap-2">
                        <i class="fa-solid fa-table"></i> مشاهده در جدول
                    </button>
                    <!-- دکمه تولید PDF بدون عبارت درجا -->
                    <button id="downloadPdfBtn" onclick="downloadReportPDF()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-bold transition shadow-lg flex items-center gap-2 relative">
                        <i class="fa-solid fa-file-pdf"></i> تولید و دانلود PDF
                        <div id="pdfLoading" class="absolute inset-0 bg-indigo-700 rounded-xl flex items-center justify-center hidden">
                            <i class="fa-solid fa-circle-notch fa-spin"></i>
                        </div>
                    </button>
                </div>
            </div>

            <!-- جدول نمایش نتایج -->
            <div class="glass-card overflow-hidden">
                <div class="bg-slate-800/60 p-4 border-b border-gray-700/50 flex justify-between items-center">
                    <h3 id="tableTitle" class="font-bold text-gray-200">پیش‌نمایش گزارش</h3>
                    <span id="resultCount" class="text-xs bg-indigo-500/20 text-indigo-300 px-3 py-1 rounded-full border border-indigo-500/30">۰ مورد</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-right text-xs md:text-sm min-w-[750px]">
                        <thead id="reportTableHead" class="bg-slate-800/40 text-gray-300 border-b border-gray-700/50">
                            <tr>
                                <th class="p-3.5">ردیف</th>
                                <th class="p-3.5">عنوان / مشخصات</th>
                                <th class="p-3.5">تاریخ / وضعیت</th>
                                <th class="p-3.5">مبلغ (تومان)</th>
                                <th class="p-3.5">عملیات</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody" class="divide-y divide-gray-700/40">
                            <tr>
                                <td colspan="5" class="p-8 text-center text-gray-500">
                                    <i class="fa-solid fa-inbox text-3xl mb-3 block opacity-50"></i>
                                    برای مشاهده داده‌ها، دکمه «مشاهده در جدول» را بزنید.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        /* Three.js Background Shader */
        function initShaderBackground() {
            const container = document.querySelector('.hero');
            const canvas = document.getElementById('shader-canvas');
            if(!canvas) return;

            const scene = new THREE.Scene();
            const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });

            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const material = new THREE.ShaderMaterial({
                uniforms: {
                    u_time: { value: 0.0 },
                    u_resolution: { value: new THREE.Vector2(container.clientWidth, container.clientHeight) }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() { vUv = uv; gl_Position = vec4(position, 1.0); }
                `,
                fragmentShader: `
                    uniform float u_time;
                    uniform vec2 u_resolution;
                    varying vec2 vUv;

                    void main() {
                        vec2 st = gl_FragCoord.xy / u_resolution.xy;
                        st.x *= u_resolution.x / u_resolution.y;

                        float wave1 = sin(vUv.x * 6.0 + u_time * 0.8) * 0.15;
                        float wave2 = cos(vUv.y * 8.0 + u_time * 1.2) * 0.15;
                        float dist = length(st - vec2(0.5 + wave1, 0.5 + wave2));

                        vec3 col1 = vec3(0.05, 0.03, 0.12);
                        vec3 col2 = vec3(0.3, 0.15, 0.6);
                        vec3 color = mix(col1, col2, smoothstep(0.7, 0.0, dist));

                        gl_FragColor = vec4(color, 0.85);
                    }
                `,
                transparent: true
            });

            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material);
            scene.add(mesh);

            window.addEventListener('resize', () => {
                renderer.setSize(container.clientWidth, container.clientHeight);
                material.uniforms.u_resolution.value.set(container.clientWidth, container.clientHeight);
            });

            let startTime = Date.now();
            function animate() {
                requestAnimationFrame(animate);
                material.uniforms.u_time.value = (Date.now() - startTime) * 0.001;
                renderer.render(scene, camera);
            }
            animate();
        }
        initShaderBackground();

        /* توابع کنترل نوار لودینگ بالای پنل */
        function showLoadingBar() {
            const bar = document.getElementById('topProgressBar');
            if (bar) bar.classList.remove('hidden');
        }

        function hideLoadingBar() {
            const bar = document.getElementById('topProgressBar');
            if (bar) bar.classList.add('hidden');
        }

        /* توابع کمکی */
        const API_HEADERS = () => ({
            "Content-Type": "application/json",
            "Authorization": "Bearer " + (localStorage.getItem("token") || localStorage.getItem("koreyadak_token") || "")
        });

        function formatNumber(num) {
            if (!num && num !== 0) return "۰";
            return num.toString().replace(/,/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function toEnglishDigits(str) {
            if (!str) return '';
            const persianDigits = [/۰/g, /۱/g, /۲/g, /۳/g, /۴/g, /۵/g, /۶/g, /۷/g, /۸/g, /۹/g];
            const arabicDigits  = [/٠/g, /١/g, /٢/g, /٣/g, /٤/g, /٥/g, /٦/g, /٧/g, /٨/g, /٩/g];
            let result = String(str);
            for (let i = 0; i < 10; i++) result = result.replace(persianDigits[i], i).replace(arabicDigits[i], i);
            return result;
        }

        function formatSearchDate(e) {
            if (e.inputType === 'deleteContentBackward' || e.inputType === 'deleteContentForward') return;
            const input = e.target;
            let val = toEnglishDigits(input.value).replace(/\D/g, '');
            if (val.length > 6) val = val.substring(0, 6);
            let formatted = '';
            if (val.length > 0) formatted += val.substring(0, 2);
            if (val.length > 2) formatted += '/' + val.substring(2, 4);
            if (val.length > 4) formatted += '/' + val.substring(4, 6);
            input.value = formatted;
        }

        // سوئیچ تم
        document.getElementById("darkToggle")?.addEventListener("change", (e) => {
            document.body.classList.toggle("light", !e.target.checked);
        });

        /* دریافت اطلاعات فرم */
        function getFilterParams() {
            return {
                type: document.getElementById('reportType').value,
                from: document.getElementById('fromDate').value,
                to: document.getElementById('toDate').value,
                keyword: document.getElementById('keyword').value
            };
        }

        /* 1. مشاهده اطلاعات در جدول (پیش‌نمایش) */
        async function fetchReportData() {
            const tbody = document.getElementById('reportTableBody');
            const thead = document.getElementById('reportTableHead');
            const params = getFilterParams();
            
            showLoadingBar();
            const queryParams = new URLSearchParams(params).toString();
            
            tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-indigo-400"><i class="fa-solid fa-spinner fa-spin ml-2"></i> در حال دریافت اطلاعات...</td></tr>`;
            
            // تغییر سربرگ جدول بر اساس نوع گزارش
            if(params.type === 'out_of_stock' || params.type === 'in_stock') {
                thead.innerHTML = `<tr><th class="p-3.5">ردیف</th><th class="p-3.5">نام قطعه / اصالت</th><th class="p-3.5">پارت نامبر / خودرو</th><th class="p-3.5">موجودی فعلی</th><th class="p-3.5">آخرین قیمت</th></tr>`;
            } else {
                thead.innerHTML = `<tr><th class="p-3.5">ردیف</th><th class="p-3.5">مشتری / عنوان</th><th class="p-3.5">تاریخ</th><th class="p-3.5">وضعیت</th><th class="p-3.5">مبلغ کل (تومان)</th><th class="p-3.5 text-center">دانلود PDF تک‌فاکتور</th></tr>`;
            }

            try {
                const res = await fetch(`/api/reports/data?${queryParams}`, { headers: API_HEADERS() });
                if (!res.ok) throw new Error("خطا در دریافت اطلاعات");
                const data = await res.json();
                
                document.getElementById('resultCount').innerText = `${data.length} مورد`;
                
                if (data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-gray-400">اطلاعاتی با این فیلترها یافت نشد.</td></tr>`;
                    return;
                }

                if(params.type === 'out_of_stock' || params.type === 'in_stock') {
                    tbody.innerHTML = data.map((item, index) => {
                        const isGen = item.is_genuine;
                        const genBadge = isGen 
                            ? `<span class="badge-genuine mr-2">GENUINE</span>` 
                            : `<span class="text-[11px] text-slate-400 bg-slate-800/60 px-2 py-0.5 rounded border border-slate-700/50 mr-2">غیر اصلی</span>`;

                        return `
                            <tr class="hover:bg-slate-800/40 transition">
                                <td class="p-3.5">${index + 1}</td>
                                <td class="p-3.5 font-bold text-indigo-300 flex items-center gap-1">
                                    <span>${item.name}</span>
                                    ${genBadge}
                                </td>
                                <td class="p-3.5 text-gray-400">${item.part_number} / ${item.compatible_cars}</td>
                                <td class="p-3.5 font-bold ${item.stock <= 0 ? 'text-red-400' : 'text-emerald-400'}">${item.stock} عدد</td>
                                <td class="p-3.5">${formatNumber(item.price)} تومان</td>
                            </tr>
                        `;
                    }).join('');
                } else {
                    tbody.innerHTML = data.map((item, index) => {
                        const kind = item.invoice_kind || (params.type.includes('sell') ? 'sell' : params.type.includes('buy') ? 'buy' : (item.invoice_type === 'فروش' ? 'sell' : 'buy'));
                        const invLabel = item.invoice_type ? ` <span class="text-xs text-indigo-400 font-normal">(${item.invoice_type})</span>` : '';

                        return `
                            <tr class="hover:bg-slate-800/40 transition">
                                <td class="p-3.5">${index + 1}</td>
                                <td class="p-3.5 font-bold text-gray-200">${item.title}${invLabel}</td>
                                <td class="p-3.5 text-gray-400">${item.date}</td>
                                <td class="p-3.5"><span class="px-2 py-1 rounded text-xs ${item.is_paid ? 'bg-emerald-500/20 text-emerald-400' : 'bg-amber-500/20 text-amber-400'}">${item.is_paid ? 'تسویه شده' : 'تسویه نشده'}</span></td>
                                <td class="p-3.5 font-bold">${formatNumber(item.total_price)}</td>
                                <td class="p-3.5 text-center">
                                    <button onclick="downloadSingleInvoicePDF('${kind}', ${item.id})" class="bg-indigo-600/80 hover:bg-indigo-600 text-white text-xs px-3 py-1.5 rounded-lg transition inline-flex items-center gap-1.5 shadow">
                                        <i class="fa-solid fa-file-pdf"></i> PDF فاکتور
                                    </button>
                                </td>
                            </tr>
                        `;
                    }).join('');
                }

            } catch (e) {
                console.error(e);
                tbody.innerHTML = `<tr><td colspan="6" class="p-6 text-center text-red-400">خطا در ارتباط با سرور. آیا بک‌اند متصل است؟</td></tr>`;
            } finally {
                hideLoadingBar();
            }
        }

        /* 2. دانلود PDF کل گزارش */
        async function downloadReportPDF() {
            const loading = document.getElementById('pdfLoading');
            const params = getFilterParams();
            const queryParams = new URLSearchParams(params).toString();
            
            showLoadingBar();
            loading.classList.remove('hidden');

            try {
                const res = await fetch(`/api/reports/pdf?${queryParams}`, {
                    method: 'GET',
                    headers: API_HEADERS()
                });

                if (!res.ok) throw new Error("مشکلی در تولید PDF به وجود آمد.");

                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `Report_${params.type}_${new Date().getTime()}.pdf`;
                
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

            } catch (e) {
                alert("خطا: " + e.message);
                console.error(e);
            } finally {
                loading.classList.add('hidden');
                hideLoadingBar();
            }
        }

        /* 3. دانلود PDF تک‌فاکتور (فروش یا خرید) */
        async function downloadSingleInvoicePDF(kind, id) {
            showLoadingBar();
            try {
                const endpoint = `/api/invoices/${kind}/${id}/pdf`;
                const res = await fetch(endpoint, { headers: API_HEADERS() });
                if (!res.ok) throw new Error("خطا در دانلود PDF فاکتور.");

                const blob = await res.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = `Invoice_${kind.toUpperCase()}_${id}.pdf`;

                document.body.appendChild(a);
                a.click();

                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
            } catch (e) {
                alert("خطا: " + e.message);
            } finally {
                hideLoadingBar();
            }
        }
    </script>
</body>
</html>
