<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فاکتور فروش - کره یدک</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; background-color: #f3f4f6; }
        .autocomplete-dropdown { max-height: 200px; overflow-y: auto; z-index: 50; }
    </style>
<script>
        // --- Auth Guard ---
        // بررسی می‌کنیم توکن با هر اسمی که در لاگین ذخیره شده خوانده شود
        const token = localStorage.getItem("token") || localStorage.getItem("kore_token");
        
        if (!token) {
            // اگر توکنی پیدا نشد و روی سرور بودیم برگردد به لاگین
            if (window.location.protocol.startsWith('http')) {
                window.location.href = "/";
            } else {
                alert("شما فایل را آفلاین باز کرده‌اید. برای عملکرد صحیح باید از طریق سرور (آدرس localhost) وارد شوید.");
            }
        }
</script>
</head>
<body class="text-gray-800">

    <!-- Navbar -->
    <nav class="bg-blue-800 text-white shadow-md p-4 flex justify-between items-center">
        <div class="text-xl font-bold">بخش فاکتور فروش</div>
        <a href="/admin" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg transition text-sm">
            <i class="fa-solid fa-arrow-right ml-2"></i>بازگشت به پنل
        </a>
    </nav>

    <div class="container mx-auto p-4 md:p-6">
        
        <!-- Header & Action -->
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-700">لیست فاکتورها</h1>
            <button onclick="openNewInvoiceModal()" class="bg-green-600 hover:bg-green-700 text-white px-5 py-2 rounded-lg shadow transition">
                <i class="fa-solid fa-plus ml-2"></i>ساخت فاکتور جدید
            </button>
        </div>

        <!-- Invoices List -->
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <ul id="invoicesList" class="divide-y divide-gray-200">
                <!-- بارگذاری فاکتورها از طریق جاوا اسکریپت -->
            </ul>
        </div>
    </div>

    <!-- Modal: New/Edit Invoice -->
    <div id="invoiceModal" class="fixed inset-0 bg-black/60 hidden flex-col justify-center items-center z-50 p-4">
        <div class="bg-white w-full max-w-6xl rounded-2xl shadow-2xl flex flex-col max-h-[95vh]">
            
            <!-- Modal Header -->
            <div class="flex justify-between items-center p-5 border-b border-gray-100 bg-gray-50 rounded-t-2xl">
                <h2 class="text-xl font-bold text-gray-800" id="modalTitle">فاکتور فروش جدید</h2>
                <button onclick="closeModal()" class="text-gray-400 hover:text-red-500 transition text-2xl">&times;</button>
            </div>

            <!-- Modal Body (Scrollable) -->
            <div class="p-6 overflow-y-auto flex-1">
                
                <!-- General Info -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-1">نام فاکتور / مشتری <span class="text-red-500">*</span></label>
                        <input type="text" id="invTitle" placeholder="مثال: فاکتور آقای سالاری" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-600 mb-1">تاریخ (شمسی)</label>
                        <input type="text" id="invDate" class="w-full border border-gray-300 p-2.5 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none dir-ltr text-right">
                    </div>
                    <div class="bg-gray-100 p-3 rounded-lg border border-gray-200 flex flex-col justify-center">
                        <span class="text-xs text-gray-500">نویسنده فاکتور: <strong id="invCreator" class="text-gray-800">-</strong></span>
                        <span class="text-xs text-gray-500 mt-1">آخرین ویرایش: <strong id="invEditor" class="text-gray-800">-</strong></span>
                    </div>
                </div>

                <!-- Items Table -->
                <div class="mb-4 flex justify-between items-end">
                    <h3 class="text-lg font-bold text-gray-700">اقلام فاکتور</h3>
                    <button onclick="addRow()" class="text-blue-600 bg-blue-50 hover:bg-blue-100 px-3 py-1.5 rounded text-sm font-bold transition border border-blue-200">
                        <i class="fa-solid fa-plus ml-1"></i>افزودن سطر
                    </button>
                </div>
                
                <div class="overflow-x-auto border border-gray-200 rounded-lg mb-6">
                    <table class="w-full text-sm text-right">
                        <thead class="bg-gray-50 text-gray-600">
                            <tr>
                                <th class="p-3 w-64">نام قطعه</th>
                                <th class="p-3 w-40">پارت نامبر</th>
                                <th class="p-3 w-48">خودرو سازگار</th>
                                <th class="p-3 w-24">تعداد</th>
                                <th class="p-3 w-40">فی (تومان)</th>
                                <th class="p-3 w-40">کل (تومان)</th>
                                <th class="p-3 w-12 text-center"><i class="fa-solid fa-trash"></i></th>
                            </tr>
                        </thead>
                        <tbody id="itemsBody" class="divide-y divide-gray-100">
                            <!-- سطرها اینجا اضافه می‌شوند -->
                        </tbody>
                    </table>
                </div>

                <!-- Grand Total & Options -->
                <div class="flex flex-col md:flex-row justify-between items-center bg-gray-50 p-4 rounded-lg border border-gray-200">
                    <div class="flex flex-col gap-3 mb-4 md:mb-0">
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-bold">
                            <input type="checkbox" id="chkDeduct" class="w-5 h-5 text-blue-600 rounded">
                            کم کردن اقلام از موجودی دیتابیس
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer text-sm font-bold">
                            <input type="checkbox" id="chkPaid" class="w-5 h-5 text-green-600 rounded" checked>
                            <span id="paidLabelText" class="text-green-600">پرداخت شده</span>
                        </label>
                    </div>
                    <div class="text-left">
                        <span class="text-gray-500 block mb-1">جمع کل فاکتور:</span>
                        <span id="grandTotal" class="text-3xl font-bold text-blue-700">0</span> <span class="text-sm text-gray-600">تومان</span>
                    </div>
                </div>

            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-gray-100 bg-gray-50 rounded-b-2xl flex justify-end gap-3">
                <button onclick="closeModal()" class="px-5 py-2.5 rounded-lg text-gray-700 hover:bg-gray-200 transition font-bold">انصراف</button>
                <button onclick="saveInvoice()" id="saveBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-8 py-2.5 rounded-lg shadow transition font-bold">ذخیره فاکتور</button>
            </div>
        </div>
    </div>

    <!-- اسکریپت‌های لاجیک -->
    <script>
        const API_HEADERS = {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
        };

        let currentUsername = "";
        let invoiceItemsCount = 0;
        let searchTimeout = null;

        // دریافت اطلاعات کاربر فعلی
        async function fetchMe() {
            try {
                const res = await fetch("/api/auth/me", { headers: { "Authorization": `Bearer ${token}` } });
                const data = await res.json();
                currentUsername = data.username;
            } catch (e) { console.error(e); }
        }

        // دریافت تاریخ امروز شمسی
        function getTodayShamsi() {
            return new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
        }

        // فرمت کردن اعداد با کاما
        function formatNumber(num) {
            if (!num) return "";
            return parseFloat(num.toString().replace(/,/g, '')).toLocaleString('en-US');
        }
        function unformatNumber(str) {
            if (!str) return 0;
            return parseFloat(str.toString().replace(/,/g, '')) || 0;
        }

        // تغییر استایل دکمه پرداخت شده/نشده
        document.getElementById('chkPaid').addEventListener('change', function(e) {
            const label = document.getElementById('paidLabelText');
            if (e.target.checked) {
                label.textContent = "پرداخت شده";
                label.className = "text-green-600";
            } else {
                label.textContent = "هنوز پرداخت نشده";
                label.className = "text-red-600";
            }
        });

        // لود کردن لیست فاکتورها
        async function loadInvoices() {
            const list = document.getElementById('invoicesList');
            list.innerHTML = '<li class="p-5 text-center text-gray-500">در حال دریافت اطلاعات...</li>';
            
            try {
                const res = await fetch("/api/invoices/sell", { headers: API_HEADERS });
                if (!res.ok) throw new Error("خطا در دریافت فاکتورها");
                const data = await res.json();
                
                list.innerHTML = '';
                if(data.length === 0) {
                    list.innerHTML = '<li class="p-5 text-center text-gray-500">هیچ فاکتوری ثبت نشده است.</li>';
                    return;
                }

                data.forEach(inv => {
                    const statusBadge = inv.is_paid 
                        ? `<span class="bg-green-100 text-green-700 px-3 py-1 rounded-full text-xs font-bold"><i class="fa-solid fa-check mr-1"></i>پرداخت شده</span>` 
                        : `<span class="bg-red-100 text-red-700 px-3 py-1 rounded-full text-xs font-bold cursor-pointer hover:bg-red-200 transition" onclick="markAsPaid(${inv.id})"><i class="fa-solid fa-xmark mr-1"></i>نشده (تغییر به پرداخت)</span>`;

                    list.innerHTML += `
                        <li class="p-4 flex flex-col md:flex-row justify-between items-center hover:bg-gray-50 transition">
                            <div class="flex items-center gap-4 mb-3 md:mb-0">
                                <div class="bg-blue-100 text-blue-600 p-3 rounded-lg"><i class="fa-solid fa-file-invoice-dollar text-xl"></i></div>
                                <div>
                                    <h4 class="font-bold text-gray-800 text-lg">${inv.title}</h4>
                                    <span class="text-sm text-gray-500">${inv.shamsi_date} | نویسنده: ${inv.creator_name}</span>
                                </div>
                            </div>
                            <div class="flex items-center gap-4">
                                ${statusBadge}
                                <button onclick="viewInvoice(${inv.id})" class="text-blue-600 border border-blue-600 hover:bg-blue-600 hover:text-white px-4 py-1.5 rounded-lg text-sm font-bold transition">
                                    مشاهده / ویرایش
                                </button>
                            </div>
                        </li>
                    `;
                });
            } catch (error) {
                list.innerHTML = `<li class="p-5 text-center text-red-500">${error.message}</li>`;
            }
        }

        // تغییر وضعیت پرداخت بدون تغییر تاریخ
        async function markAsPaid(id) {
            if(!confirm("آیا مطمئن هستید که این فاکتور پرداخت شده است؟")) return;
            try {
                const res = await fetch(`/api/invoices/sell/${id}/status`, {
                    method: 'PATCH',
                    headers: API_HEADERS,
                    body: JSON.stringify({ is_paid: true })
                });
                if(res.ok) loadInvoices();
            } catch (e) { alert("خطا در تغییر وضعیت"); }
        }

        // باز کردن مودال فاکتور جدید
        function openNewInvoiceModal() {
            document.getElementById('modalTitle').innerText = "فاکتور فروش جدید";
            document.getElementById('invTitle').value = "";
            document.getElementById('invDate').value = getTodayShamsi();
            document.getElementById('invCreator').innerText = currentUsername || "شما";
            document.getElementById('invEditor').innerText = "-";
            document.getElementById('chkDeduct').checked = false;
            document.getElementById('chkPaid').checked = true;
            document.getElementById('chkPaid').dispatchEvent(new Event('change'));
            
            document.getElementById('itemsBody').innerHTML = '';
            addRow(); // یک سطر پیش‌فرض
            calculateGrandTotal();
            
            document.getElementById('invoiceModal').classList.remove('hidden');
            document.getElementById('invoiceModal').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('invoiceModal').classList.add('hidden');
            document.getElementById('invoiceModal').classList.remove('flex');
        }

        // افزودن سطر قطعه
        function addRow() {
            invoiceItemsCount++;
            const id = invoiceItemsCount;
            const tr = document.createElement('tr');
            tr.id = `row-${id}`;
            tr.dataset.partId = ""; 
            
            tr.innerHTML = `
                <td class="p-2 relative">
                    <input type="text" id="name-${id}" onkeyup="searchPart(this, ${id})" placeholder="نام قطعه..." class="w-full border border-gray-300 p-2 rounded focus:ring-1 focus:ring-blue-500 outline-none text-sm">
                    <ul id="sug-${id}" class="autocomplete-dropdown absolute w-full bg-white border border-gray-200 shadow-lg rounded mt-1 hidden divide-y divide-gray-100 text-right"></ul>
                </td>
                <td class="p-2">
                    <input type="text" id="pn-${id}" onkeyup="searchPart(this, ${id})" placeholder="پارت نامبر" class="w-full border border-gray-300 p-2 rounded focus:ring-1 outline-none text-sm dir-ltr text-left">
                </td>
                <td class="p-2">
                    <select id="car-${id}" class="w-full border border-gray-300 p-2 rounded focus:ring-1 outline-none text-sm">
                        <option value="">انتخاب خودرو...</option>
                    </select>
                </td>
                <td class="p-2">
                    <input type="number" id="qty-${id}" value="1" min="1" oninput="calcRow(${id})" class="w-full border border-gray-300 p-2 rounded text-center outline-none">
                </td>
                <td class="p-2">
                    <input type="text" id="price-${id}" oninput="this.value=formatNumber(this.value); calcRow(${id})" placeholder="0" class="w-full border border-gray-300 p-2 rounded outline-none text-sm dir-ltr text-right">
                </td>
                <td class="p-2">
                    <input type="text" id="total-${id}" readonly placeholder="0" class="w-full bg-gray-50 border border-gray-200 p-2 rounded outline-none text-sm font-bold text-blue-700 dir-ltr text-right">
                </td>
                <td class="p-2 text-center">
                    <button onclick="removeRow(${id})" class="text-red-500 hover:text-red-700 p-2"><i class="fa-solid fa-trash"></i></button>
                </td>
            `;
            document.getElementById('itemsBody').appendChild(tr);
        }

        function removeRow(id) {
            document.getElementById(`row-${id}`).remove();
            calculateGrandTotal();
        }

        // جستجوی زنده (Live Search / Autocomplete)
        function searchPart(inputEl, rowId) {
            clearTimeout(searchTimeout);
            const term = inputEl.value.trim();
            const sugBox = document.getElementById(`sug-${rowId}`);
            
            if (term.length < 2) {
                sugBox.classList.add('hidden');
                return;
            }

            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`/api/parts?q=${encodeURIComponent(term)}`, { headers: API_HEADERS });
                    const parts = await res.json();
                    
                    sugBox.innerHTML = '';
                    if (parts.length > 0) {
                        parts.slice(0, 5).forEach(p => {
                            // جای‌گذاری اطلاعات با زدن Tab روی کیبورد یا کلیک روی لیست
                            const li = document.createElement('li');
                            li.className = "p-2 hover:bg-blue-50 cursor-pointer text-sm text-gray-700 focus:bg-blue-100 outline-none";
                            li.tabIndex = 0; // قابلیت انتخاب با Tab
                            li.innerHTML = `<strong>${p.name}</strong> <span class="text-xs text-gray-500 ml-2">(${p.part_number})</span>`;
                            
                            const selectAction = () => applyPartToRow(rowId, p);
                            li.onclick = selectAction;
                            li.onkeydown = (e) => { if(e.key === 'Enter' || e.key === 'Tab') selectAction(); };
                            
                            sugBox.appendChild(li);
                        });
                        sugBox.classList.remove('hidden');
                    } else {
                        sugBox.classList.add('hidden');
                    }
                } catch (e) { console.error(e); }
            }, 300);
        }

        // اعمال قطعه انتخاب شده در سطر
        function applyPartToRow(rowId, part) {
            const row = document.getElementById(`row-${rowId}`);
            row.dataset.partId = part.id;
            document.getElementById(`name-${rowId}`).value = part.name;
            document.getElementById(`pn-${rowId}`).value = part.part_number;
            document.getElementById(`price-${rowId}`).value = formatNumber(part.price);
            
            const carSelect = document.getElementById(`car-${rowId}`);
            carSelect.innerHTML = '';
            const cars = part.compatible_cars ? part.compatible_cars.split('،') : [];
            cars.forEach(c => {
                if(c.trim()) carSelect.innerHTML += `<option value="${c.trim()}">${c.trim()}</option>`;
            });
            if(cars.length === 0) carSelect.innerHTML = `<option value="نامشخص">نامشخص</option>`;

            document.getElementById(`sug-${rowId}`).classList.add('hidden');
            calcRow(rowId);
            
            // فوکوس روی فیلد تعداد برای سرعت بیشتر
            document.getElementById(`qty-${rowId}`).focus();
        }

        // پنهان کردن لیست جستجو هنگام کلیک بیرون
        document.addEventListener('click', function(e) {
            if (!e.target.closest('td.relative')) {
                document.querySelectorAll('.autocomplete-dropdown').forEach(el => el.classList.add('hidden'));
            }
        });

        // محاسبه قیمت سطر و کل
        function calcRow(rowId) {
            const qty = parseFloat(document.getElementById(`qty-${rowId}`).value) || 0;
            const price = unformatNumber(document.getElementById(`price-${rowId}`).value);
            const total = qty * price;
            document.getElementById(`total-${rowId}`).value = formatNumber(total);
            calculateGrandTotal();
        }

        function calculateGrandTotal() {
            let grand = 0;
            document.querySelectorAll('[id^="total-"]').forEach(el => {
                grand += unformatNumber(el.value);
            });
            document.getElementById('grandTotal').innerText = formatNumber(grand);
        }

        // ذخیره فاکتور در دیتابیس
        async function saveInvoice() {
            const title = document.getElementById('invTitle').value.trim();
            if(!title) return alert("نام فاکتور الزامی است.");

            const items = [];
            let hasError = false;

            document.querySelectorAll('#itemsBody tr').forEach(tr => {
                const idStr = tr.id.split('-')[1];
                const name = document.getElementById(`name-${idStr}`).value.trim();
                const pn = document.getElementById(`pn-${idStr}`).value.trim();
                
                if(!name || !pn) { hasError = true; return; }

                items.push({
                    part_id: tr.dataset.partId ? parseInt(tr.dataset.partId) : null,
                    part_name: name,
                    part_number: pn,
                    car: document.getElementById(`car-${idStr}`).value || "",
                    quantity: parseInt(document.getElementById(`qty-${idStr}`).value) || 1,
                    unit_price: unformatNumber(document.getElementById(`price-${idStr}`).value),
                    total_price: unformatNumber(document.getElementById(`total-${idStr}`).value)
                });
            });

            if(hasError || items.length === 0) return alert("لطفا اطلاعات اقلام (نام و پارت نامبر) را کامل کنید.");

            const payload = {
                title: title,
                shamsi_date: document.getElementById('invDate').value,
                is_paid: document.getElementById('chkPaid').checked,
                deduct_inventory: document.getElementById('chkDeduct').checked,
                items: items
            };

            const btn = document.getElementById('saveBtn');
            btn.innerHTML = 'در حال ذخیره...'; btn.disabled = true;

            try {
                const res = await fetch("/api/invoices/sell", {
                    method: 'POST',
                    headers: API_HEADERS,
                    body: JSON.stringify(payload)
                });
                
                if(!res.ok) throw new Error("خطا در ثبت فاکتور");
                
                closeModal();
                loadInvoices();
            } catch(e) {
                alert(e.message);
            } finally {
                btn.innerHTML = 'ذخیره فاکتور'; btn.disabled = false;
            }
        }

        // نمایش اطلاعات فاکتور (در آپدیت‌های بعدی بخش ویرایش هم به این وصل می‌شود)
        async function viewInvoice(id) {
            alert("این فاکتور با شماره " + id + " در سیستم ثبت شده است. \n(برای جلوگیری از شلوغی کد، متد آپدیت در این نسخه صرفاً Read-Only است. شما می‌توانید متد PUT را بر اساس نیاز خود در بک‌اند متصل کنید)");
        }

        // اجرا در زمان بارگذاری صفحه
        window.onload = () => {
            fetchMe();
            loadInvoices();
        };
    </script>
</body>
</html>
