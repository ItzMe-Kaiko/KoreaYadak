<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>کُره یدک | سامانه استعلام قطعات</title>

<!-- FOUC Prevention -->
<script>
  (function() {
    const savedTheme = localStorage.getItem('theme');
    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    if (savedTheme === 'light' || (!savedTheme && prefersLight)) {
      document.documentElement.setAttribute('data-theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
/* Premium Fonts */
@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Inter:wght@400;500;600;700&display=swap');
@import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css');

:root {
  --step-0: clamp(0.875rem, 0.8315rem + 0.2174vw, 1rem);
  --step-1: clamp(1.125rem, 0.9946rem + 0.6522vw, 1.375rem);
  --step-2: clamp(1.5rem, 1.3261rem + 0.8696vw, 1.875rem);

  /* Deep Dark SaaS Palette */
  --bg-main: #08090c; 
  --bg-surface: #0f1117; 
  --bg-card: rgba(17, 20, 29, 0.75);
  --bg-card-hover: rgba(23, 27, 38, 0.85);
  --bg-sidebar: rgba(13, 15, 22, 0.8);
  --border-color: rgba(255, 255, 255, 0.08);
  --border-color-hover: rgba(59, 130, 246, 0.35);
  
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --primary-glow: rgba(59, 130, 246, 0.15);
  --accent-cyan: #06b6d4;
  --accent-purple: #8b5cf6;
  
  --text-main: #f3f4f6;
  --text-muted: #9ca3af;
  --text-dim: #6b7280;
  
  --danger: #ef4444;
  --success: #10b981;
  --success-glow: rgba(16, 185, 129, 0.2);
  --warning: #f59e0b;
  --glass-blur: blur(20px);
}

html[data-theme="light"] {
  --bg-main: #f8fafc;
  --bg-surface: #ffffff;
  --bg-card: rgba(255, 255, 255, 0.85);
  --bg-card-hover: #ffffff;
  --bg-sidebar: rgba(248, 250, 252, 0.9);
  --border-color: rgba(0, 0, 0, 0.08);
  --border-color-hover: rgba(37, 99, 235, 0.3);
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-dim: #94a3b8;
  --primary: #2563eb;
  --primary-glow: rgba(37, 99, 235, 0.1);
  --glass-blur: blur(12px);
}

* { box-sizing: border-box; }

body {
  font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
  font-size: var(--step-0);
  line-height: 1.6;
  margin: 0;
  background-color: var(--bg-main);
  background-image: 
    radial-gradient(circle at 50% 0%, rgba(59, 130, 246, 0.05) 0%, transparent 50%),
    linear-gradient(to bottom, rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(to right, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size: 100% 100%, 32px 32px, 32px 32px;
  color: var(--text-main);
  transition: background-color 0.3s ease, color 0.3s ease;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

.part-number, .badge-genuine, .font-mono {
  font-family: 'JetBrains Mono', 'Inter', monospace;
}

.icon {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  vertical-align: middle;
  display: inline-block;
  flex-shrink: 0;
}

/* Header & Ambient Hero Shader */
.hero {
  position: relative;
  height: 160px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  border-bottom: 1px solid var(--border-color);
  overflow: hidden;
  background: radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.12), transparent 70%);
}

#shader-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
  opacity: 0.85;
}

.hero-content {
  position: relative;
  z-index: 1;
  backdrop-filter: blur(8px);
  padding: 12px 28px;
  border-radius: 20px;
  background: rgba(8, 9, 12, 0.45);
  border: 1px solid rgba(255, 255, 255, 0.08);
  box-shadow: 0 20px 40px rgba(0,0,0,0.3);
  animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}

.hero h1 { 
  font-size: var(--step-2);
  font-weight: 800;
  line-height: 1.2;
  margin: 0 0 4px; 
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #ffffff 0%, #a5f3fc 50%, #60a5fa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero p { margin: 0; color: var(--text-muted); font-size: 13px; font-weight: 400; }

/* Application Layout */
.app-layout {
  display: flex;
  max-width: 1380px;
  margin: 24px auto;
  gap: 24px;
  padding: 0 20px;
  position: relative;
  z-index: 2;
  opacity: 0;
  animation: appFadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

.main-content { flex: 1; min-width: 0; }

.sidebar {
  width: 270px;
  background: var(--bg-sidebar);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 18px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  height: fit-content;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  transition: all 0.3s ease;
}

.brand-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--border-color);
  margin-bottom: 6px;
}

.brand-badge .logo-icon {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  width: 40px;
  height: 40px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
}

.brand-badge div { display: flex; flex-direction: column; }
.brand-badge .title { font-weight: 700; font-size: 15px; color: var(--text-main); }
.brand-badge .subtitle { font-size: 11px; color: var(--text-dim); }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  border-radius: 10px;
  color: var(--text-muted);
  background: transparent;
  border: 1px solid transparent;
  width: 100%;
  text-align: right;
  font-size: 13.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  text-decoration: none;
  font-family: inherit;
}

.nav-item:hover, .nav-item.active {
  background: rgba(59, 130, 246, 0.1);
  border-color: rgba(59, 130, 246, 0.25);
  color: #60a5fa;
  transform: translateX(-2px);
}

/* Sticky Command Header */
.sticky-header-container {
  position: sticky;
  top: 16px;
  z-index: 900;
  backdrop-filter: var(--glass-blur);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 24px;
  background: var(--bg-sidebar);
  border: 1px solid var(--border-color);
  box-shadow: 0 16px 36px rgba(0,0,0,0.3);
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border-color);
}

.user-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12.5px;
  color: var(--text-muted);
}

.status-indicator-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 10px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-color);
  border-radius: 20px;
}

.theme-toggle {
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  font-size: 12.5px;
  color: var(--text-muted);
}

.switch { position: relative; display: inline-block; width: 40px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; cursor: pointer; inset: 0;
  background-color: rgba(255,255,255,0.1); transition: .25s ease; border-radius: 24px;
  border: 1px solid var(--border-color);
}
.slider:before {
  position: absolute; content: ""; height: 16px; width: 16px;
  left: 2px; bottom: 2px; background-color: #cbd5e1; transition: .25s ease; border-radius: 50%;
}
input:checked + .slider { background-color: var(--primary); border-color: transparent; }
input:checked + .slider:before { transform: translateX(18px); background-color: #fff; }

/* Command Bar Search */
.search-section {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
  position: relative;
}

.search-wrapper {
  position: relative;
  flex: 2;
  display: flex;
  align-items: center;
}

.search-wrapper .search-icon {
  position: absolute;
  right: 14px;
  color: var(--text-dim);
  pointer-events: none;
}

.search-wrapper .shortcut-hint {
  position: absolute;
  left: 12px;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 6px;
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--border-color);
  color: var(--text-dim);
  pointer-events: none;
  font-family: 'JetBrains Mono', monospace;
}

.search-section input, .search-section select {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 11px 42px 11px 40px;
  border-radius: 12px;
  font-size: 13.5px;
  outline: none;
  font-family: inherit;
  transition: all 0.2s ease;
  width: 100%;
}

.search-section select {
  flex: 1;
  cursor: pointer;
  padding: 11px 14px;
}

.search-section input:focus, .search-section select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
  background: var(--bg-main);
}

.in-stock-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: inherit;
  transition: all 0.2s ease;
}

.in-stock-btn:hover { 
  border-color: var(--success); 
  color: var(--text-main);
  background: rgba(16, 185, 129, 0.05);
}

.in-stock-btn.active {
  background: rgba(16, 185, 129, 0.12);
  border-color: var(--success);
  color: var(--success);
  font-weight: 600;
  box-shadow: 0 0 12px var(--success-glow);
}

/* Card Grid Layout */
.grid { 
  display: grid; 
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
  gap: 18px; 
}

.card {
  background: var(--bg-card);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 14px;
  opacity: 0;
  transform: translateY(12px);
  animation: cardReveal 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
              box-shadow 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
              border-color 0.25s ease,
              background-color 0.25s ease;
  will-change: transform, opacity;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
}

.card:hover {
  transform: translateY(-3px);
  background: var(--bg-card-hover);
  border-color: var(--border-color-hover);
  box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.5);
}

.card-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card-header-right { display: flex; align-items: center; gap: 10px; }
.card-title { font-weight: 700; font-size: 14.5px; color: var(--text-main); }

/* Dynamic Status Dot Indicator */
.status-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; background-color: var(--success);
  box-shadow: 0 0 10px var(--success); flex-shrink: 0;
  position: relative;
}

.status-dot::after {
  content: '';
  position: absolute;
  top: -3px; left: -3px; right: -3px; bottom: -3px;
  border-radius: 50%;
  border: 1px solid var(--success);
  animation: pulseGlow 2.5s infinite;
}

.status-dot.off { background-color: var(--text-dim); box-shadow: none; opacity: 0.4; }
.status-dot.off::after { display: none; }

.stock-tag {
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--border-color);
  padding: 3px 10px; border-radius: 8px; font-size: 12px; color: var(--text-muted);
}

.part-number-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.part-number {
  color: #60a5fa; font-size: 13.5px;
  background: var(--primary-glow); padding: 4px 10px; border-radius: 8px; direction: ltr;
  border: 1px solid rgba(59, 130, 246, 0.25);
  font-weight: 600;
}

/* Gold Genuine Badge */
.badge-genuine {
  background: linear-gradient(135deg, #d97706 0%, #fbbf24 50%, #b45309 100%);
  background-size: 200% auto;
  color: #1c1002;
  font-weight: 800;
  font-size: 0.7rem;
  padding: 3px 10px;
  border-radius: 8px;
  border: 1px solid rgba(251, 191, 36, 0.5);
  box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.cars-list { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
.car-chip { 
  background: rgba(255, 255, 255, 0.04); 
  padding: 2px 8px; 
  border-radius: 6px; 
  margin: 2px; 
  display: inline-block; 
  border: 1px solid var(--border-color); 
  color: var(--text-main);
  font-size: 11.5px;
}

.cars-row-container { display: flex; justify-content: space-between; align-items: center; gap: 8px; }

.accordion-btn {
  background: rgba(255, 255, 255, 0.03); 
  border: 1px solid var(--border-color); 
  color: var(--text-muted);
  border-radius: 8px; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: all 0.25s ease;
}
.accordion-btn:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-glow); }
.accordion-btn.active { transform: rotate(180deg); border-color: var(--primary); color: var(--primary); background: var(--primary-glow); }

/* Grid Accordion Wrapper */
.details-wrapper {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.35s cubic-bezier(0.16, 1, 0.3, 1);
}
.details-wrapper.open {
  grid-template-rows: 1fr;
}
.details-inner {
  overflow: hidden;
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity 0.25s ease, transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  background: var(--bg-surface);
  border-radius: 10px;
}
.details-wrapper.open .details-inner {
  opacity: 1;
  transform: translateY(0);
  padding: 12px;
  margin-top: 8px;
  border: 1px solid var(--border-color);
}
.details-item { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.details-item:last-child { margin-bottom: 0; }
.details-item span.val { color: var(--text-main); font-weight: 600; }

mark { background: rgba(245, 158, 11, 0.25); color: #fde047; padding: 0 3px; border-radius: 3px; border: 1px solid rgba(245, 158, 11, 0.4); }

/* Skeleton / Spinner Loader */
.loader-spinner {
  width: 28px; height: 28px; border: 2.5px solid var(--border-color); border-top-color: var(--primary);
  border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulseGlow {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(2.2); opacity: 0; }
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-12px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes appFadeIn {
  0% { opacity: 0; transform: translateY(16px); }
  100% { opacity: 1; transform: translateY(0); }
}
@keyframes cardReveal {
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 850px) {
  .app-layout { flex-direction: column; padding: 0 12px; margin: 12px auto; }
  .sidebar { width: 100%; padding: 12px; }
  .search-section { flex-direction: column; gap: 8px; }
  .search-section select, .in-stock-btn { width: 100%; justify-content: center; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="hero">
  <canvas id="shader-canvas"></canvas>
  <div class="hero-content">
    <h1>کُره یدک</h1>
    <p>سامانه جامع لیست و استعلام قطعات اصلی خودروهای کره‌ای</p>
  </div>
</div>

<div class="app-layout">
  <aside class="sidebar">
    <div class="brand-badge">
      <div class="logo-icon">
        <svg class="icon" style="width:22px;height:22px;" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </div>
      <div>
        <span class="title">کُره یدک</span>
        <span class="subtitle font-mono">v1.0.0</span>
      </div>
    </div>
    <a class="nav-item active" href="/">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      لیست قطعات
    </a>
    <a class="nav-item" href="/admin">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      ورود به پنل مدیریت
    </a>
  </aside>

  <main class="main-content">
    <div class="sticky-header-container">
      <div class="top-bar">
        <div class="user-status">
          <div class="status-indicator-badge">
            <svg class="icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            وضعیت کاربر: <strong style="color:var(--text-main)">مهمان</strong>
          </div>
        </div>
        <label class="theme-toggle">
          <span>حالت تاریک</span>
          <div class="switch">
            <input type="checkbox" id="darkToggle">
            <span class="slider"></span>
          </div>
        </label>
      </div>

      <div class="search-section">
        <div class="search-wrapper">
          <svg class="icon search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input id="search" autocomplete="off" placeholder="نام قطعه، پارت نامبر یا خودرو را سرچ کن..." dir="auto">
          <span class="shortcut-hint">/</span>
        </div>
        <select id="car">
          <option value="">همه خودروها</option>
        </select>
        <button id="inStockBtn" class="in-stock-btn" onclick="toggleInStockFilter()">
          <svg class="icon" viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
          فقط موجود
        </button>
      </div>

      <div style="font-size: 11.5px; color: var(--text-muted); display: flex; justify-content: space-between; align-items: center; padding: 0 4px;">
        <span id="count">0 مورد یافت شد</span>
        <span class="font-mono">Microcat Standard Catalog</span>
      </div>
    </div>

    <div id="results" class="grid"></div>
  </main>
</div>

<script>
/* WebGL Dynamic Animated Background */
function initShaderBackground() {
  const container = document.querySelector('.hero');
  const canvas = document.getElementById('shader-canvas');
  if (!container || !canvas) return;
  
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const material = new THREE.ShaderMaterial({
    uniforms: {
      u_time: { value: 0.0 },
      u_resolution: { value: new THREE.Vector2(container.clientWidth, container.clientHeight) }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float u_time;
      uniform vec2 u_resolution;
      varying vec2 vUv;

      void main() {
        vec2 st = gl_FragCoord.xy / u_resolution.xy;
        st.x *= u_resolution.x / u_resolution.y;

        vec2 color_st = vUv;
        float wave1 = sin(color_st.x * 5.0 + u_time * 0.6) * 0.12;
        float wave2 = cos(color_st.y * 7.0 + u_time * 0.9) * 0.12;
        
        float dist = length(st - vec2(0.5 + wave1, 0.5 + wave2));
        
        vec3 col1 = vec3(0.03, 0.04, 0.07);
        vec3 col2 = vec3(0.15, 0.35, 0.85);
        vec3 col3 = vec3(0.45, 0.15, 0.80); 

        vec3 color = mix(col1, col2, smoothstep(0.8, 0.0, dist));
        color += mix(vec3(0.0), col3, smoothstep(0.5, 0.0, length(st - vec2(0.8, 0.2))));

        gl_FragColor = vec4(color, 0.75);
      }
    `,
    transparent: true
  });

  const geometry = new THREE.PlaneGeometry(2, 2);
  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  window.addEventListener('resize', () => {
    renderer.setSize(container.clientWidth, container.clientHeight);
    material.uniforms.u_resolution.value.set(container.clientWidth, container.clientHeight);
  });

  let startTime = Date.now();
  let animationFrameId;

  function animate() {
    animationFrameId = requestAnimationFrame(animate);
    material.uniforms.u_time.value = (Date.now() - startTime) * 0.001;
    renderer.render(scene, camera);
  }

  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        animate();
      } else {
        cancelAnimationFrame(animationFrameId);
      }
    });
  });
  observer.observe(container);
}

initShaderBackground();

/* Application Logic & API Preservations */
const API_BASE = "";
const search = document.getElementById("search");
const car = document.getElementById("car");
const results = document.getElementById("results");
const count = document.getElementById("count");

let onlyInStock = false;

// Theme Toggle Handler
const darkToggle = document.getElementById("darkToggle");
if (document.documentElement.getAttribute("data-theme") === "dark") {
  darkToggle.checked = true;
}

darkToggle.addEventListener("change", (e) => {
  const newTheme = e.target.checked ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", newTheme);
  localStorage.setItem("theme", newTheme);
});

// Quick shortcut listener for '/'
window.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== search) {
    e.preventDefault();
    search.focus();
  }
});

async function api(path) {
  const response = await fetch(API_BASE + path);
  let data = {};
  try { data = await response.json(); } catch (_) {}
  if (!response.ok) throw new Error(data.detail || "خطایی رخ داد.");
  return data;
}

function toggleInStockFilter() {
  onlyInStock = !onlyInStock;
  document.getElementById("inStockBtn").classList.toggle("active", onlyInStock);
  loadParts();
}

async function loadCars() {
  try {
    const cars = await api("/api/cars");
    car.innerHTML = '<option value="">همه خودروها</option>';
    cars.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      car.appendChild(opt);
    });
  } catch(_) {}
}

async function loadParts() {
  const params = new URLSearchParams();
  if (search.value.trim()) params.set("q", search.value.trim());
  if (car.value.trim()) params.set("car", car.value.trim());
  if (onlyInStock) params.set("in_stock", "true");

  results.innerHTML = `
    <div style="grid-column:1/-1; text-align:center; padding:60px 20px;">
      <div class="loader-spinner"></div>
      <div style="color:var(--text-muted); font-size:13.5px;">در حال بارگذاری اطلاعات قطعات...</div>
    </div>`;

  try {
    let parts = await api("/api/parts?" + params.toString());
    if (onlyInStock) {
      parts = parts.filter(p => p.stock && p.stock >= 1);
    }

    count.textContent = parts.length + " مورد یافت شد";

    if (!parts.length) {
      results.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:50px; color:var(--text-muted)">قطعه‌ای با این مشخصات یافت نشد.</div>';
      return;
    }

    const q = search.value.trim();

    results.innerHTML = parts.map((p, index) => {
      const isAvailable = (p.stock && p.stock >= 1);
      const formattedPrice = p.price ? Number(p.price).toLocaleString('fa-IR') + ' تومان' : 'ثبت نشده';
      const animDelay = (index % 12) * 0.04; 
      
      return `
        <div class="card" style="animation-delay: ${animDelay}s">
          <div class="card-header">
            <div class="card-header-right">
              <span class="status-dot ${isAvailable ? '' : 'off'}" title="${isAvailable ? 'موجود' : 'ناموجود'}"></span>
              <div class="card-title">${highlight(p.name, q)}</div>
            </div>
            <div class="stock-tag">موجودی: <b class="font-mono">${p.stock ?? 0}</b></div>
          </div>

          <div class="part-number-row">
            ${p.is_genuine ? '<span class="badge-genuine">Genuine</span>' : ''}
            <span class="part-number">${highlight(p.part_number, q)}</span>
          </div>

          <div class="cars-row-container">
            <div class="cars-list">
              <b>خودروها:</b> ${p.compatible_cars ? p.compatible_cars.split(/[،,]/).map(c => `<span class="car-chip">${highlight(c.trim(), q)}</span>`).join('') : 'نامشخص'}
            </div>
            <button class="accordion-btn" title="مشاهده جزئیات قیمت" onclick="toggleAccordion(${p.id}, this)">
              <svg class="icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>

          <div id="wrapper-${p.id}" class="details-wrapper">
            <div class="details-inner">
              <div class="details-item">
                <span>قیمت قطعه:</span>
                <span class="val">${formattedPrice}</span>
              </div>
              <div class="details-item">
                <span>آخرین تغییر قیمت:</span>
                <span class="val">${formatDate(p.price_updated_at)}</span>
              </div>
            </div>
          </div>

        </div>
      `;
    }).join("");
  } catch (e) {
    results.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--danger); padding:40px;">خطا: ${e.message}</div>`;
  }
}

function toggleAccordion(id, btn) {
  const wrapper = document.getElementById(`wrapper-${id}`);
  if (!wrapper) return;
  wrapper.classList.toggle("open");
  btn.classList.toggle("active");
}

function formatDate(dateStr) {
  if (!dateStr) return 'ثبت نشده';
  try {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString('fa-IR');
  } catch (_) {
    return dateStr;
  }
}

function escapeRegExp(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function highlight(text, q) {
  if (!text || !q) return text || "";
  const words = q.trim().split(/\s+/).filter(Boolean).map(escapeRegExp);
  if (!words.length) return text;
  const reg = new RegExp("(" + words.join("|") + ")", "gi");
  return text.replace(reg, "<mark>$1</mark>");
}

let searchTimer;
search.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadParts, 250);
});
car.addEventListener("change", loadParts);

loadCars();
loadParts();
</script>
</body>
</html>
