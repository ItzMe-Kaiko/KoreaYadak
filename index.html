<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>کُره یدک | سامانه استعلام قطعات</title>

<!-- FOUC Prevention: Runs immediately to set the theme before rendering -->
<script>
  (function() {
    const savedTheme = localStorage.getItem('theme');
    const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
    if (savedTheme === 'light' || (!savedTheme && prefersLight)) {
      document.documentElement.setAttribute('data-theme', 'light');
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  })();
</script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Premium Typography Imports */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
@import url('https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css');

:root {
  /* Fluid Typography Steps */
  --step-0: clamp(0.875rem, 0.8315rem + 0.2174vw, 1rem); /* 14px to 16px */
  --step-1: clamp(1.125rem, 0.9946rem + 0.6522vw, 1.5rem); /* 18px to 24px */
  --step-2: clamp(1.5rem, 1.3261rem + 0.8696vw, 2rem); /* 24px to 32px */

  /* Dark Mode Defaults (Ultra-Premium Deep Blue/Black) */
  --bg-main: #09090b; 
  --bg-surface: #18181b; 
  --bg-card: rgba(24, 24, 27, 0.65);
  --bg-sidebar: rgba(24, 24, 27, 0.75);
  --border-color: rgba(255, 255, 255, 0.08);
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --primary-glow: rgba(59, 130, 246, 0.2);
  --text-main: #fafafa;
  --text-muted: #a1a1aa;
  --danger: #ef4444;
  --success: #10b981;
  --warning: #f59e0b;
  --glass-blur: blur(16px);
}

html[data-theme="light"] {
  /* Light Mode (Crisp, High Contrast) */
  --bg-main: #fcfcfc;
  --bg-surface: #ffffff;
  --bg-card: rgba(255, 255, 255, 0.8);
  --bg-sidebar: rgba(255, 255, 255, 0.9);
  --border-color: rgba(0, 0, 0, 0.08);
  --text-main: #09090b;
  --text-muted: #71717a;
  --primary: #2563eb;
  --primary-glow: rgba(37, 99, 235, 0.15);
  --glass-blur: blur(12px);
}

* { box-sizing: border-box; }

body {
  font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif;
  font-size: var(--step-0);
  line-height: 1.6;
  margin: 0;
  background-color: var(--bg-main);
  color: var(--text-main);
  transition: background-color 0.4s ease, color 0.4s ease;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* Typography Overrides for Part Numbers */
.part-number, .badge-genuine {
  font-family: 'Inter', sans-serif;
  letter-spacing: 0.5px;
}

/* Icon System Styling */
.icon {
  width: 18px;
  height: 18px;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
  fill: none;
  vertical-align: middle;
  display: inline-block;
  flex-shrink: 0;
}

/* Hero & WebGL Shader Header */
.hero {
  position: relative;
  height: 180px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  border-bottom: 1px solid var(--border-color);
  overflow: hidden;
}

#shader-canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 1;
  backdrop-filter: blur(4px);
  padding: 15px 25px;
  border-radius: 16px;
  background: rgba(0, 0, 0, 0.2);
  border: 1px solid rgba(255, 255, 255, 0.05);
  animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

.hero h1 { 
  font-size: var(--step-2);
  font-weight: 800;
  line-height: 1.2;
  margin: 0 0 6px; 
  letter-spacing: -0.5px;
  background: linear-gradient(135deg, #ffffff 0%, #60a5fa 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.hero p { margin: 0; color: var(--text-muted); font-size: 13px; }

/* Layout Architecture */
.app-layout {
  display: flex;
  max-width: 1300px;
  margin: 20px auto;
  gap: 20px;
  padding: 0 15px;
  position: relative;
  z-index: 2;
  opacity: 0;
  animation: appFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  animation-delay: 0.1s;
}

.main-content { flex: 1; min-width: 0; }

.sidebar {
  width: 260px;
  background: var(--bg-sidebar);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 20px 15px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  height: fit-content;
  box-shadow: 0 10px 30px rgba(0,0,0,0.1);
  transition: all 0.3s ease;
}

.brand-badge {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 15px;
  border-bottom: 1px solid var(--border-color);
  margin-bottom: 5px;
}
.brand-badge .logo-icon {
  background: linear-gradient(135deg, #3b82f6, #1d4ed8);
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: 0 4px 12px var(--primary-glow);
}
.brand-badge div { display: flex; flex-direction: column; }
.brand-badge .title { font-weight: 700; font-size: 16px; }
.brand-badge .subtitle { font-size: 11px; color: var(--text-muted); }

.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 15px;
  border-radius: 10px;
  color: var(--text-muted);
  background: transparent;
  border: 1px solid transparent;
  width: 100%;
  text-align: right;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
  text-decoration: none;
  font-family: inherit;
  will-change: transform;
}
.nav-item:hover, .nav-item.active {
  background: rgba(59, 130, 246, 0.12);
  border-color: rgba(59, 130, 246, 0.3);
  color: #60a5fa;
  transform: translateX(-3px);
}

/* Sticky Header Controls */
.sticky-header-container {
  position: sticky;
  top: 10px;
  z-index: 900;
  backdrop-filter: var(--glass-blur);
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 20px;
  background: var(--bg-sidebar);
  border: 1px solid var(--border-color);
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border-color);
}

.user-status {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--text-muted);
}

.theme-toggle {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 13px;
}
.switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; cursor: pointer; inset: 0;
  background-color: #3f3f46; transition: .3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 24px;
}
.slider:before {
  position: absolute; content: ""; height: 18px; width: 18px;
  left: 3px; bottom: 3px; background-color: white; transition: .3s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 50%;
}
input:checked + .slider { background-color: var(--primary); }
input:checked + .slider:before { transform: translateX(20px); }

/* Search Inputs */
.search-section { display: flex; gap: 10px; margin-bottom: 10px; }
.search-section input, .search-section select {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--text-main);
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  transition: all 0.2s ease;
}
.search-section input:focus, .search-section select:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px var(--primary-glow);
}
.search-section input { flex: 2; width: 100%; text-transform: uppercase; }
.search-section select { flex: 1; cursor: pointer; }

.in-stock-btn {
  background: var(--bg-surface);
  border: 1px solid var(--border-color);
  color: var(--text-muted);
  padding: 10px 16px;
  border-radius: 12px;
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: inherit;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
              box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1),
              background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease;
  will-change: transform;
}
.in-stock-btn:hover { 
  border-color: var(--success); 
  color: var(--text-main);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(16, 185, 129, 0.15);
}
.in-stock-btn.active {
  background: rgba(16, 185, 129, 0.15);
  border-color: var(--success);
  color: var(--success);
  font-weight: 600;
  box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
}

/* Card Grid Layout */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

.card {
  background: var(--bg-card);
  backdrop-filter: var(--glass-blur);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 12px;
  opacity: 0;
  transform: translateY(15px) scale(0.98);
  animation: cardReveal 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
              box-shadow 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
              border-color 0.3s ease;
  will-change: transform, opacity;
}

.card:hover {
  transform: translateY(-4px) scale(1.01);
  border-color: rgba(59, 130, 246, 0.4);
  box-shadow: 0 12px 25px -5px rgba(0, 0, 0, 0.2);
}

.card-header { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.card-header-right { display: flex; align-items: center; gap: 8px; }
.card-title { font-weight: 700; font-size: 15px; }

/* Dynamic Animated Indicator */
.status-dot {
  width: 10px; height: 10px; border-radius: 50%;
  display: inline-block; background-color: var(--success);
  box-shadow: 0 0 10px var(--success); flex-shrink: 0;
  position: relative;
}
.status-dot::after {
  content: '';
  position: absolute;
  top: -2px; left: -2px; right: -2px; bottom: -2px;
  border-radius: 50%;
  border: 1px solid var(--success);
  animation: pulseGlow 2s infinite;
}
.status-dot.off { background-color: var(--text-muted); box-shadow: none; opacity: 0.4; }
.status-dot.off::after { display: none; }

.stock-tag {
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid var(--border-color);
  padding: 4px 10px; border-radius: 8px; font-size: 12px; color: var(--text-muted);
}

.part-number-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.part-number {
  color: var(--primary); font-size: 14px;
  background: var(--primary-glow); padding: 4px 10px; border-radius: 6px; direction: ltr;
  border: 1px dashed rgba(59, 130, 246, 0.3);
}
/* Animated Premium Gold Genuine Badge */
.badge-genuine {
  background: linear-gradient(90deg, #d97706 0%, #fbbf24 30%, #fffbeb 50%, #fbbf24 70%, #d97706 100%);
  background-size: 200% auto;
  color: #451a03; /* Deep brown/black for crisp contrast */
  font-weight: 800;
  font-size: 0.75rem;
  padding: 4px 12px;
  border-radius: 12px;
  border: 1px solid rgba(251, 191, 36, 0.6);
  box-shadow: 0 0 12px rgba(245, 158, 11, 0.4), inset 0 1px 2px rgba(255, 255, 255, 0.8);
  animation: goldShimmer 3s linear infinite;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Add this keyframe right below it for the infinite shine loop */
@keyframes goldShimmer {
  to { background-position: -200% center; }
}

.cars-list { font-size: 12px; color: var(--text-muted); line-height: 1.6; }
.car-chip { background: rgba(255, 255, 255, 0.06); padding: 3px 8px; border-radius: 6px; margin: 2px; display: inline-block; border: 1px solid var(--border-color); }

.cars-row-container { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.accordion-btn {
  background: transparent; border: 1px solid var(--border-color); color: var(--text-muted);
  border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  will-change: transform;
}
.accordion-btn:hover { border-color: var(--primary); color: var(--primary); }
.accordion-btn.active { transform: rotate(180deg); border-color: var(--primary); color: var(--primary); background: var(--primary-glow); }

/* High Performance CSS Grid Accordion (No Layout Thrashing) */
.details-wrapper {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.details-wrapper.open {
  grid-template-rows: 1fr;
}
.details-inner {
  overflow: hidden;
  opacity: 0;
  transform: translateY(-5px);
  transition: opacity 0.3s ease, transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  background: var(--bg-surface);
  border-radius: 10px;
}
.details-wrapper.open .details-inner {
  opacity: 1;
  transform: translateY(0);
  padding: 12px;
  margin-top: 6px;
  border: 1px solid var(--border-color);
}
.details-item { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
.details-item:last-child { margin-bottom: 0; }
.details-item span.val { color: var(--text-main); font-weight: 600; }

mark { background: rgba(245, 158, 11, 0.3); color: #fbbf24; padding: 0 3px; border-radius: 3px; border: 1px solid rgba(245, 158, 11, 0.4); }

/* Loader Animation */
.loader-spinner {
  width: 32px; height: 32px; border: 3px solid var(--border-color); border-top-color: var(--primary);
  border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
}

/* Dynamic Keyframes */
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulseGlow {
  0% { transform: scale(1); opacity: 0.8; }
  100% { transform: scale(1.8); opacity: 0; }
}
@keyframes fadeInDown {
  from { opacity: 0; transform: translateY(-15px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes appFadeIn {
  0% { opacity: 0; transform: translateY(20px); filter: blur(4px); }
  100% { opacity: 1; transform: translateY(0); filter: blur(0); }
}
@keyframes cardReveal {
  to { opacity: 1; transform: translateY(0) scale(1); }
}

@media (max-width: 850px) {
  .app-layout { flex-direction: column; padding: 0 10px; margin: 10px auto; }
  .sidebar { width: 100%; padding: 12px; gap: 8px; }
  .search-section { flex-direction: column; gap: 8px; }
  .search-section select, .in-stock-btn { width: 100%; justify-content: center; }
  .grid { grid-template-columns: 1fr; }
}
</style>
</head>

        <svg class="icon" style="width:24px;height:24px;" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>

<script>
/* WebGL Three.js Dynamic Animated Shader with IntersectionObserver for Performance */
function initShaderBackground() {
  const container = document.querySelector('.hero');
  const canvas = document.getElementById('shader-canvas');
  
  const scene = new THREE.Scene();
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
  
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  const material = new THREE.ShaderMaterial({
    uniforms: {
      u_time: { value: 0.0 },
      u_resolution: { value: new THREE.Vector2(container.clientWidth, container.clientHeight) }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform float u_time;
      uniform vec2 u_resolution;
      varying vec2 vUv;

      void main() {
        vec2 st = gl_FragCoord.xy / u_resolution.xy;
        st.x *= u_resolution.x / u_resolution.y;

        vec2 color_st = vUv;
        float wave1 = sin(color_st.x * 6.0 + u_time * 0.8) * 0.15;
        float wave2 = cos(color_st.y * 8.0 + u_time * 1.2) * 0.15;
        
        float dist = length(st - vec2(0.5 + wave1, 0.5 + wave2));
        
        vec3 col1 = vec3(0.06, 0.09, 0.16);
        vec3 col2 = vec3(0.23, 0.51, 0.96);
        vec3 col3 = vec3(0.58, 0.2, 0.92); 

        vec3 color = mix(col1, col2, smoothstep(0.7, 0.0, dist));
        color += mix(vec3(0.0), col3, smoothstep(0.4, 0.0, length(st - vec2(0.8, 0.2))));

        gl_FragColor = vec4(color, 0.85);
      }
    `,
    transparent: true
  });

  const geometry = new THREE.PlaneGeometry(2, 2);
  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);

  window.addEventListener('resize', () => {
    renderer.setSize(container.clientWidth, container.clientHeight);
    material.uniforms.u_resolution.value.set(container.clientWidth, container.clientHeight);
  });

  let startTime = Date.now();
  let animationFrameId;

  function animate() {
    animationFrameId = requestAnimationFrame(animate);
    material.uniforms.u_time.value = (Date.now() - startTime) * 0.001;
    renderer.render(scene, camera);
  }

  // Optimize: Only render WebGL when the hero section is in the viewport
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        animate();
      } else {
        cancelAnimationFrame(animationFrameId);
      }
    });
  });
  observer.observe(container);
}

initShaderBackground();

/* Application Logic */
const API_BASE = "";
const search = document.getElementById("search");
const car = document.getElementById("car");
const results = document.getElementById("results");
const count = document.getElementById("count");

let onlyInStock = false;

// Sync Theme Toggle Checkbox State
const darkToggle = document.getElementById("darkToggle");
if (document.documentElement.getAttribute("data-theme") === "dark") {
  darkToggle.checked = true;
}

darkToggle.addEventListener("change", (e) => {
  const newTheme = e.target.checked ? "dark" : "light";
  document.documentElement.setAttribute("data-theme", newTheme);
  localStorage.setItem("theme", newTheme);
});


async function api(path) {
  const response = await fetch(API_BASE + path);
  let data = {};
  try { data = await response.json(); } catch (_) {}
  if (!response.ok) throw new Error(data.detail || "خطایی رخ داد.");
  return data;
}

function toggleInStockFilter() {
  onlyInStock = !onlyInStock;
  document.getElementById("inStockBtn").classList.toggle("active", onlyInStock);
  loadParts();
}

async function loadCars() {
  try {
    const cars = await api("/api/cars");
    car.innerHTML = '<option value="">همه خودروها</option>';
    cars.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      car.appendChild(opt);
    });
  } catch(_) {}
}

async function loadParts() {
  const params = new URLSearchParams();
  if (search.value.trim()) params.set("q", search.value.trim());
  if (car.value.trim()) params.set("car", car.value.trim());
  if (onlyInStock) params.set("in_stock", "true");

  results.innerHTML = `
    <div style="grid-column:1/-1; text-align:center; padding:50px;">
      <div class="loader-spinner"></div>
      <div style="color:var(--text-muted); font-size:14px;">در حال بارگذاری اطلاعات...</div>
    </div>`;

  try {
    let parts = await api("/api/parts?" + params.toString());
    if (onlyInStock) {
      parts = parts.filter(p => p.stock && p.stock >= 1);
    }

    count.textContent = parts.length + " مورد یافت شد";

    if (!parts.length) {
      results.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:40px; color:var(--text-muted)">قطعه‌ای با این مشخصات یافت نشد.</div>';
      return;
    }

    const q = search.value.trim();

    results.innerHTML = parts.map((p, index) => {
      const isAvailable = (p.stock && p.stock >= 1);
      const formattedPrice = p.price ? Number(p.price).toLocaleString('fa-IR') + ' تومان' : 'ثبت نشده';
      const animDelay = (index % 12) * 0.05; // Staggered reveal animation 
      
      return `
        <div class="card" style="animation-delay: ${animDelay}s">
          <div class="card-header">
            <div class="card-header-right">
              <span class="status-dot ${isAvailable ? '' : 'off'}" title="${isAvailable ? 'موجود' : 'ناموجود'}"></span>
              <div class="card-title">${highlight(p.name, q)}</div>
            </div>
            <div class="stock-tag">موجودی: <b>${p.stock ?? 0}</b></div>
          </div>

          <div class="part-number-row">
            ${p.is_genuine ? '<span class="badge-genuine">Genuine</span>' : ''}
            <span class="part-number">${highlight(p.part_number, q)}</span>
          </div>

          <div class="cars-row-container">
            <div class="cars-list">
              <b>خودروها:</b> ${p.compatible_cars ? p.compatible_cars.split(/[،,]/).map(c => `<span class="car-chip">${highlight(c.trim(), q)}</span>`).join('') : 'نامشخص'}
            </div>
            <button class="accordion-btn" title="مشاهده جزئیات قیمت" onclick="toggleAccordion(${p.id}, this)">
              <svg class="icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
          </div>

          <!-- Optimized CSS Grid Accordion -->
          <div id="wrapper-${p.id}" class="details-wrapper">
            <div class="details-inner">
              <div class="details-item">
                <span>قیمت قطعه:</span>
                <span class="val">${formattedPrice}</span>
              </div>
              <div class="details-item">
                <span>آخرین تغییر قیمت:</span>
                <span class="val">${formatDate(p.price_updated_at)}</span>
              </div>
            </div>
          </div>

        </div>
      `;
    }).join("");
  } catch (e) {
    results.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--danger)">خطا: ${e.message}</div>`;
  }
}

function toggleAccordion(id, btn) {
  // Target the grid wrapper for layout-thrashing-free animation
  const wrapper = document.getElementById(`wrapper-${id}`);
  if (!wrapper) return;
  wrapper.classList.toggle("open");
  btn.classList.toggle("active");
}

function formatDate(dateStr) {
  if (!dateStr) return 'ثبت نشده';
  try {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString('fa-IR');
  } catch (_) {
    return dateStr;
  }
}

function escapeRegExp(string) { return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function highlight(text, q) {
  if (!text || !q) return text || "";
  const words = q.trim().split(/\s+/).filter(Boolean).map(escapeRegExp);
  if (!words.length) return text;
  const reg = new RegExp("(" + words.join("|") + ")", "gi");
  return text.replace(reg, "<mark>$1</mark>");
}

let searchTimer;
search.addEventListener("input", () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadParts, 250);
});
car.addEventListener("change", loadParts);

loadCars();
loadParts();
</script>
</body>
</html>
