<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>کُره یدک | پنل مدیریت</title>

<!-- FOUC Blocking Script: Runs before DOM renders to prevent theme flashing -->
<script>
  (function() {
    const savedTheme = localStorage.getItem('koreyadak_theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (savedTheme === 'light' || (!savedTheme && !prefersDark)) {
      document.documentElement.classList.add('light');
    }
  })();
</script>

<!-- Premium Typography: Vazirmatn for Persian, Geist Mono for Tech/Numbers -->
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">

<script>
const token =
  localStorage.getItem("koreyadak_token") ||
  sessionStorage.getItem("koreyadak_token");

if (!token) {
  window.location.replace("/login");
}
</script>


<style>
:root{
  --bg:#070b11;
  --surface:#0d141d;
  --surface-2:#111a25;
  --surface-3:#162231;
  --border:rgba(148,163,184,.13);
  --border-strong:rgba(0,229,255,.26);
  --primary:#00d9ef;
  --primary-2:#00a9c2;
  --text:#f4f7fb;
  --muted:#91a0b1;
  --success:#22c55e;
  --danger:#ef4444;
  --warning:#fbbf24;
  --radius:14px;
  --shadow:0 12px 32px rgba(0,0,0,.22);
}

html.light{
  --bg:#f4f7fb;
  --surface:#ffffff;
  --surface-2:#f8fafc;
  --surface-3:#eef3f8;
  --border:rgba(15,23,42,.10);
  --border-strong:rgba(8,145,178,.30);
  --primary:#0891b2;
  --primary-2:#0e7490;
  --text:#0f172a;
  --muted:#64748b;
  --shadow:0 10px 24px rgba(15,23,42,.08);
}

*{box-sizing:border-box}
html{
  margin:0;
  background:var(--bg);
  font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;
  font-size:16px;
  color-scheme:dark;
}
html.light{color-scheme:light}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -10%,rgba(0,217,239,.09),transparent 34%),
    var(--bg);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit}
button,a{ -webkit-tap-highlight-color:transparent; }
.icon{
  width:18px;height:18px;display:inline-block;flex:0 0 auto;
  stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;fill:none;
  vertical-align:middle;
}

.hero{
  position:relative;
  min-height:138px;
  margin:14px 14px 0;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:20px;
  background:
    radial-gradient(circle at 50% 15%,rgba(0,217,239,.12),transparent 42%),
    linear-gradient(135deg,var(--surface-2),var(--surface));
  box-shadow:var(--shadow);
}
.hero-glow{
  position:absolute;
  width:360px;height:180px;top:-130px;left:50%;
  transform:translateX(-50%);
  border-radius:50%;
  background:rgba(0,217,239,.12);
  pointer-events:none;
}
.hero-content{
  position:relative;z-index:1;
  width:min(92%,620px);
  padding:18px 22px;
  text-align:center;
  border:1px solid var(--border);
  border-radius:16px;
  background:rgba(3,8,14,.28);
}
html.light .hero-content{background:rgba(255,255,255,.68)}
.hero h1{
  margin:0 0 5px;
  font-size:clamp(1.35rem,3vw,2rem);
  line-height:1.3;
  font-weight:800;
  letter-spacing:-.5px;
  color:var(--text);
}
.hero p{margin:0;color:var(--muted);font-size:.84rem}

.app-layout{
  width:min(1380px,100%);
  margin:14px auto 28px;
  padding:0 14px;
  display:grid;
  grid-template-columns:240px minmax(0,1fr);
  gap:14px;
  align-items:start;
}
.main-content{min-width:0}

.sidebar{
  position:sticky;
  top:12px;
  z-index:20;
  display:flex;
  flex-direction:column;
  gap:5px;
  padding:12px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  max-height:calc(100vh - 24px);
  overflow:auto;
}
.brand-badge{
  display:flex;align-items:center;gap:10px;
  padding:2px 4px 12px;
  margin-bottom:3px;
  border-bottom:1px solid var(--border);
}
.brand-badge .logo-icon{
  width:38px;height:38px;flex:0 0 38px;
  display:flex;align-items:center;justify-content:center;
  border-radius:11px;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  color:#032027;
}
.brand-badge div{display:flex;flex-direction:column;min-width:0}
.brand-badge .title{font-weight:800;font-size:.95rem}
.brand-badge .subtitle{font-size:.72rem;color:var(--muted)}

.nav-item{
  display:flex;align-items:center;gap:9px;
  width:100%;
  min-height:42px;
  padding:9px 11px;
  color:var(--muted);
  background:transparent;
  border:1px solid transparent;
  border-radius:10px;
  text-align:right;
  text-decoration:none;
  cursor:pointer;
}
.nav-item:hover,.nav-item.active{
  background:rgba(0,217,239,.07);
  border-color:rgba(0,217,239,.18);
  color:var(--primary);
}
.gemini-nav-item .gemini-star{transition:fill .18s ease}
.gemini-nav-item:hover .gemini-star{fill:currentColor}

.sticky-header-container{
  position:sticky;
  top:10px;
  z-index:15;
  padding:12px;
  margin-bottom:14px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
}
.top-bar{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
  padding-bottom:9px;
  margin-bottom:10px;
  border-bottom:1px solid var(--border);
}
.user-status,.theme-toggle{
  display:flex;align-items:center;gap:7px;
  color:var(--muted);
  font-size:.82rem;
}
.user-status strong{color:var(--text)!important}

.switch{position:relative;width:42px;height:23px;display:inline-block;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.slider{
  position:absolute;inset:0;
  cursor:pointer;border-radius:999px;
  background:#243242;
  border:1px solid var(--border);
}
.slider:before{
  content:"";
  position:absolute;width:17px;height:17px;left:2px;top:2px;
  background:#fff;border-radius:50%;
  transition:transform .18s ease;
}
input:checked + .slider{background:rgba(0,217,239,.34)}
input:checked + .slider:before{transform:translateX(18px)}

.search-section{
  display:grid;
  grid-template-columns:minmax(0,2fr) minmax(180px,1fr) auto;
  gap:8px;
  margin-bottom:9px;
}
.search-section input,.search-section select,.form-input{
  width:100%;
  min-height:44px;
  padding:10px 12px;
  color:var(--text);
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:11px;
  outline:none;
}
.search-section input{text-transform:uppercase}
.search-section input:focus,.search-section select:focus,.form-input:focus{
  border-color:var(--border-strong);
  box-shadow:0 0 0 3px rgba(0,217,239,.06);
}
.in-stock-btn{
  min-height:44px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 13px;
  color:var(--muted);
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:11px;
  white-space:nowrap;
  cursor:pointer;
}
.in-stock-btn.active{
  color:var(--success);
  border-color:rgba(34,197,94,.45);
  background:rgba(34,197,94,.08);
}
.err-msg{min-height:20px;margin-bottom:8px;color:var(--danger);font-size:.8rem}
.input-error{border-color:var(--danger)!important}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:11px;
}
.card{
  min-width:0;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  background:linear-gradient(180deg,var(--surface-2),var(--surface));
  border:1px solid var(--border);
  border-radius:14px;
  box-shadow:0 7px 20px rgba(0,0,0,.12);
  content-visibility:auto;
  contain-intrinsic-size:260px;
}
.card-header,.cars-row-container,.part-number-row,.card-actions,.details-item{
  display:flex;align-items:center;
}
.card-header{justify-content:space-between;gap:8px}
.card-header-right{display:flex;align-items:center;gap:8px;min-width:0}
.card-title{font-weight:750;font-size:.92rem;line-height:1.45;min-width:0;overflow-wrap:anywhere}
.status-dot{
  width:9px;height:9px;flex:0 0 9px;border-radius:50%;
  background:var(--success);
  box-shadow:0 0 7px rgba(34,197,94,.45);
}
.status-dot.off{background:#64748b;box-shadow:none;opacity:.65}
.stock-tag,.car-chip{
  background:var(--surface-3);
  border:1px solid var(--border);
  border-radius:8px;
}
.stock-tag{
  flex:0 0 auto;
  padding:4px 8px;
  color:var(--muted);
  font-size:.74rem;
}
.part-number-row{gap:7px;flex-wrap:wrap}
.part-number{
  direction:ltr;
  color:var(--primary);
  background:rgba(0,217,239,.06);
  border:1px solid rgba(0,217,239,.16);
  border-radius:7px;
  padding:4px 8px;
  font-family:'Geist Mono',ui-monospace,monospace;
  font-size:.82rem;
  font-weight:700;
}
.badge-genuine{
  padding:4px 8px;
  border-radius:8px;
  border:1px solid rgba(251,191,36,.28);
  background:rgba(251,191,36,.10);
  color:#fbbf24;
  font-size:.72rem;
  font-weight:800;
}
.cars-row-container{justify-content:space-between;gap:8px;align-items:flex-start}
.cars-list{
  min-width:0;
  color:var(--muted);
  font-size:.77rem;
  line-height:1.65;
}
.car-chip{
  display:inline-block;
  margin:2px 1px;
  padding:2px 6px;
  font-size:.72rem;
}
.accordion-btn{
  width:34px;height:34px;flex:0 0 34px;
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--border);
  border-radius:9px;
  color:var(--muted);
  background:var(--surface-3);
  cursor:pointer;
}
.accordion-btn.active{color:var(--primary);border-color:var(--border-strong)}
.accordion-btn.active i,.accordion-btn.active .icon{transform:rotate(180deg)}
.details-panel{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .18s ease,opacity .15s ease}
.details-panel.open{grid-template-rows:1fr;opacity:1}
.details-panel-wrapper{overflow:hidden}
.details-content-box{
  margin-top:2px;
  padding:10px;
  display:flex;flex-direction:column;gap:7px;
  background:var(--surface-3);
  border:1px solid var(--border);
  border-radius:10px;
  font-size:.76rem;color:var(--muted);
}
.details-item{justify-content:space-between;gap:10px}
.details-item span.val{color:var(--text);font-weight:700;text-align:left}

.card-actions{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
  padding-top:9px;
  border-top:1px dashed var(--border);
}
.btn-sm,.btn-primary,.btn-secondary,.load-more-btn{
  min-height:40px;
  display:flex;align-items:center;justify-content:center;gap:5px;
  border-radius:9px;
  cursor:pointer;
}
.btn-sm{
  padding:7px 6px;
  color:var(--text);
  border:1px solid var(--border);
  background:var(--surface-3);
  font-size:.75rem;
}
.btn-stock{border-color:rgba(14,165,233,.25);color:#7dd3fc}
.btn-price{border-color:rgba(34,197,94,.25);color:#86efac}
.btn-edit{border-color:rgba(245,158,11,.25);color:#fcd34d}
.btn-delete{border-color:rgba(239,68,68,.25);color:#fca5a5}
.btn-sm:active,.load-more-btn:active,.btn-primary:active{transform:scale(.985)}

.load-more-wrap{
  grid-column:1/-1;
  display:flex;
  justify-content:center;
  padding:6px 0 2px;
}
.load-more-btn{
  min-width:min(100%,260px);
  padding:10px 18px;
  color:#052027;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  border:0;
  font-weight:800;
}
.load-more-meta{
  margin-top:4px;
  color:var(--muted);
  font-size:.72rem;
  text-align:center;
}

.btn-primary{
  width:100%;
  padding:11px 14px;
  color:#052027;
  background:linear-gradient(135deg,var(--primary),var(--primary-2));
  border:0;
  font-weight:800;
}
.btn-secondary{
  color:var(--text);
  background:var(--surface-2);
  border:1px solid var(--border);
}

.modal{
  position:fixed;inset:0;z-index:10000;
  display:none;align-items:center;justify-content:center;
  padding:12px;
  background:rgba(0,0,0,.66);
}
.modal.active-modal{display:flex}
.modal-box{
  width:min(440px,100%);
  max-height:min(90vh,720px);
  overflow:auto;
  padding:18px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:0 24px 60px rgba(0,0,0,.30);
}
.modal-header-title{
  display:flex;align-items:center;gap:8px;
  margin-bottom:12px;
  font-weight:800;
}
.modal-box input,.modal-box select{margin-bottom:10px}
.checkbox-wrap{
  display:flex;align-items:center;justify-content:space-between;
  gap:10px;
  margin-bottom:12px;
  padding:9px 11px;
  border-radius:10px;
  border:1px solid rgba(245,158,11,.20);
  background:rgba(245,158,11,.06);
  cursor:pointer;
}
.checkbox-wrap span{display:flex;align-items:center;gap:6px;color:var(--warning);font-size:.82rem;font-weight:700}
.password-wrap{position:relative}
.password-wrap .form-input{padding-left:42px}
.eye-btn{
  position:absolute;left:8px;top:0;height:44px;
  display:flex;align-items:center;justify-content:center;
  padding:6px;color:var(--muted);
  background:none;border:0;cursor:pointer;
}
.loader-spinner{
  width:28px;height:28px;margin:0 auto 10px;
  border:3px solid var(--border);
  border-top-color:var(--primary);
  border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
mark{
  color:#fbbf24;
  background:rgba(245,158,11,.12);
  border-radius:3px;
}

@media (max-width:900px){
  .app-layout{grid-template-columns:1fr}
  .sidebar{
    position:sticky;top:8px;
    max-height:none;
    flex-direction:row;
    align-items:center;
    overflow-x:auto;
    overflow-y:hidden;
    padding:7px;
    gap:5px;
  }
  .sidebar::-webkit-scrollbar{display:none}
  .brand-badge{
    min-width:155px;
    padding:3px 7px;
    margin:0;
    border:0;
    border-left:1px solid var(--border);
  }
  .brand-badge .subtitle{display:none}
  .nav-item{width:auto;flex:0 0 auto;white-space:nowrap;padding:9px 11px}
}

@media (max-width:680px){
  .hero{min-height:116px;margin:8px 8px 0;border-radius:16px}
  .hero-content{padding:13px 15px;border-radius:13px}
  .hero h1{font-size:1.25rem}
  .hero p{font-size:.76rem}
  .app-layout{padding:0 8px;margin:8px auto 18px;gap:8px}
  .sticky-header-container{position:sticky;top:68px;padding:9px;border-radius:13px}
  .top-bar{align-items:flex-start}
  .theme-toggle span{display:none}
  .search-section{
    grid-template-columns:1fr 1fr;
    gap:7px;
  }
  .search-section input{grid-column:1/-1}
  .search-section select,.in-stock-btn{width:100%}
  .grid{grid-template-columns:1fr;gap:8px}
  .card{padding:12px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,.10)}
  .card-actions{grid-template-columns:1fr 1fr}
  .btn-sm{min-height:42px}
  .stock-tag{font-size:.7rem}
  .cars-row-container{gap:6px}
  .modal{align-items:flex-end;padding:8px}
  .modal-box{max-height:88vh;border-radius:16px 16px 10px 10px;padding:15px}
}

@media (prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
}
</style>

</head>
<body>

<div class="hero">
  <div class="hero-glow" aria-hidden="true"></div>
  <div class="hero-content">
    <h1>کُره یدک | پنل مدیریت</h1>
    <p>مدیریت موجودی، قیمت‌ها و قطعات سامانه</p>
  </div>
</div>

<div class="app-layout">
  <aside class="sidebar">
    <div class="brand-badge">
      <div class="logo-icon">
        <svg class="icon" style="width:24px;height:24px;" viewBox="0 0 24 24"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </div>
      <div>
        <span class="title">کُره یدک</span>
        <span class="subtitle">پنل مدیریت</span>
      </div>
    </div>

    <a class="nav-item" href="/">
      <svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      مشاهده سایت (مهمان)
    </a>
    <button class="nav-item active" onclick="openAddModal()">
      <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      افزودن قطعه
    </button>
    <button class="nav-item" onclick="openPriceModal()">
      <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      ویرایش قیمت
    </button>

    <a class="nav-item" href="/admin/buy">
      <svg class="icon" viewBox="0 0 24 24"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      فاکتور خرید
    </a>
    <a class="nav-item" href="/admin/sell">
      <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="12" y1="18" x2="12" y2="12"/><line x1="9" y1="15" x2="15" y2="15"/></svg>
      فاکتور فروش
    </a>
    <a class="nav-item" href="/admin/report">
      <svg class="icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
      گزارش
    </a>

<!-- دکمه هوشمند جمینای -->
    <a class="nav-item gemini-nav-item" href="/admin/ai-helping">
      <svg class="icon" viewBox="0 0 24 24" style="fill: currentColor; stroke: none;">
        <defs>
          <linearGradient id="gemini-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4285F4" />
            <stop offset="35%" stop-color="#9B51E0" />
            <stop offset="70%" stop-color="#E91E63" />
            <stop offset="100%" stop-color="#FBBC05" />
          </linearGradient>
        </defs>

<script>
/* Application Logic */
const API_BASE = "";
const TOKEN_KEY = "koreyadak_token";

const search = document.getElementById("search");
const car = document.getElementById("car");
const results = document.getElementById("results");
const count = document.getElementById("count");

let onlyInStock = false;
window.partsData = {};

function token() { return localStorage.getItem(TOKEN_KEY); }
function authHeaders() { return token() ? { "Authorization": "Bearer " + token() } : {}; }

function formatPriceInput(input) {
  let val = input.value.replace(/[^0-9]/g, "");
  if (val) {
    input.value = parseInt(val, 10).toLocaleString('en-US');
  } else {
    input.value = "";
  }
}

function getRawPrice(input) {
  if (!input || !input.value) return 0;
  return parseFloat(input.value.replace(/,/g, "")) || 0;
}

function setFormattedPrice(input, val) {
  if (val !== null && val !== undefined && val !== "") {
    input.value = parseInt(val, 10).toLocaleString('en-US');
  } else {
    input.value = "";
  }
}

async function api(path, options = {}) {
  const headers = { ...authHeaders(), ...(options.headers || {}) };
  const response = await fetch(API_BASE + path, { ...options, headers });
  let data = {};
  try { data = await response.json(); } catch (_) {}
  if (!response.ok) throw new Error(data.detail || "خطایی رخ داد.");
  return data;
}

function toggleInStockFilter() {
  onlyInStock = !onlyInStock;
  document.getElementById("inStockBtn").classList.toggle("active", onlyInStock);
  loadParts();
}

function showModal(id) { 
  const modal = document.getElementById(id);
  modal.style.display = "flex";
  setTimeout(() => modal.classList.add("active-modal"), 10);
}

function closeModal(id) { 
  const modal = document.getElementById(id);
  modal.classList.remove("active-modal");
  setTimeout(() => modal.style.display = "none", 300);
}

function openAddModal() { 
  clearErrors('addModal');
  document.getElementById("addName").value = "";
  document.getElementById("addPartNum").value = "";
  document.getElementById("addCars").value = "";
  document.getElementById("addStock").value = "";
  document.getElementById("addPrice").value = "";
  document.getElementById("addGenuine").checked = false;
  showModal('addModal'); 
}

function filterPriceParts() {
  const q = document.getElementById("pricePartSearch").value.trim().toLowerCase();
  const select = document.getElementById("pricePartSelect");
  select.innerHTML = '<option value="">-- انتخاب قطعه --</option>';

  Object.values(window.partsData).forEach(p => {
    const text = `${p.name} (${p.part_number})`.toLowerCase();
    if (!q || text.includes(q)) {
      const opt = document.createElement("option");
      opt.value = p.id;
      opt.textContent = `${p.name} (${p.part_number})`;
      select.appendChild(opt);
    }
  });
}

function openPriceModal(id = null) {
  clearErrors('priceModal');
  const selectWrap = document.getElementById("pricePartSelectWrap");
  const infoWrap = document.getElementById("pricePartInfo");
  const priceInput = document.getElementById("priceValue");
  const idInput = document.getElementById("pricePartId");
  document.getElementById("pricePartSearch").value = "";

  filterPriceParts();

  if (id && window.partsData[id]) {
    const p = window.partsData[id];
    selectWrap.style.display = "none";
    infoWrap.style.display = "block";
    document.getElementById("pricePartName").textContent = `${p.name} (${p.part_number})`;
    idInput.value = p.id;
    setFormattedPrice(priceInput, p.price ?? 0);
  } else {
    selectWrap.style.display = "block";
    infoWrap.style.display = "none";
    idInput.value = "";
    priceInput.value = "";
  }

  showModal("priceModal");
}

function onPriceSelectChange() {
  const id = document.getElementById("pricePartSelect").value;
  const priceInput = document.getElementById("priceValue");
  if (id && window.partsData[id]) {
    document.getElementById("pricePartId").value = id;
    setFormattedPrice(priceInput, window.partsData[id].price ?? 0);
  } else {
    document.getElementById("pricePartId").value = "";
    priceInput.value = "";
  }
}

async function savePrice() {
  const id = document.getElementById("pricePartId").value;
  const priceVal = getRawPrice(document.getElementById("priceValue"));
  const err = document.getElementById("priceError");
  err.textContent = "";

  if (!id) {
    err.textContent = "لطفا یک قطعه را انتخاب کنید.";
    return;
  }
  if (isNaN(priceVal) || priceVal < 0) {
    document.getElementById("priceValue").classList.add("input-error");
    err.textContent = "لطفا قیمت معتبر وارد کنید.";
    return;
  }

  try {
    await api(`/api/parts/${id}/price`, {
      method: "PATCH",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ price: priceVal })
    });
    closeModal("priceModal");
    loadParts();
  } catch (e) { err.textContent = e.message; }
}

function openAccountModal() { clearErrors('accountModal'); showModal('accountModal'); }

document.querySelectorAll('input').forEach(input => {
  input.addEventListener('input', () => input.classList.remove('input-error'));
});

function clearErrors(modalId) {
  const modal = document.getElementById(modalId);
  if (!modal) return;
  modal.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
  modal.querySelectorAll('.err-msg').forEach(el => el.textContent = '');
}

async function checkSession() {
  const token = localStorage.getItem(TOKEN_KEY);
  if (!token) {
    window.location.replace("/login");
    return;
  }

  try {
    const res = await fetch("/api/auth/me", {
      headers: { "Authorization": "Bearer " + token }
    });
    
    if (!res.ok) throw new Error("Unauthorized");
    
    const userData = await res.json();
    if (userData && userData.username) {
      const userEl = document.getElementById("currentUser");
      if (userEl) userEl.textContent = userData.username;
    }

    await loadCars();
    await loadParts();
  } catch (_) {
    localStorage.removeItem(TOKEN_KEY);
    window.location.replace("/login");
  }
}

function logout() {
  localStorage.removeItem(TOKEN_KEY);
  window.location.href = "/";
}

async function saveAccount() {
  const currPass = document.getElementById("currentPassword");
  const newUser = document.getElementById("newUsername");
  const newPass = document.getElementById("newPassword");
  const newPassRep = document.getElementById("newPasswordRepeat");
  const err = document.getElementById("accountError");
  err.textContent = "";

  let isValid = true;
  if (!currPass.value) { currPass.classList.add("input-error"); isValid = false; }
  if (!newUser.value.trim()) { newUser.classList.add("input-error"); isValid = false; }
  if (!isValid) return;

  try {
    await api("/api/auth/change-credentials", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        current_password: currPass.value,
        new_username: newUser.value.trim(),
        new_password: newPass.value,
        new_password_repeat: newPassRep.value
      })
    });
    err.style.color = "var(--success)";
    err.textContent = "تغییرات با موفقیت اعمال شد.";
    setTimeout(() => { closeModal("accountModal"); checkSession(); }, 1000);
  } catch (e) {
    err.style.color = "var(--danger)";
    err.textContent = e.message;
  }
}

async function loadCars() {
  try {
    const cars = await api("/api/cars");
    car.innerHTML = '<option value="">همه خودروها</option>';
    cars.forEach(c => {
      const opt = document.createElement("option");
      opt.value = c;
      opt.textContent = c;
      car.appendChild(opt);
    });
  } catch(_) {}
}

let partsController = null;
let currentParts = [];
let visiblePartCount = 0;
const PARTS_PER_BATCH = () => window.matchMedia('(max-width: 680px)').matches ? 12 : 24;

async function loadParts() {
  const params = new URLSearchParams();
  const q = search.value.trim();
  const selectedCar = car.value.trim();
  if (q) params.set("q", q);
  if (selectedCar) params.set("car", selectedCar);
  if (onlyInStock) params.set("in_stock", "true");

  if (partsController) partsController.abort();
  partsController = new AbortController();

  results.innerHTML = `
    <div style="grid-column:1/-1;text-align:center;padding:38px 12px;">
      <div class="loader-spinner"></div>
      <div style="color:var(--muted);font-size:13px;">در حال بارگذاری اطلاعات...</div>
    </div>`;

  try {
    let parts = await api("/api/parts?" + params.toString(), { signal: partsController.signal });
    if (!Array.isArray(parts)) parts = [];
    if (onlyInStock) parts = parts.filter(p => p.stock && p.stock >= 1);

    currentParts = parts;
    window.partsData = {};
    parts.forEach(p => { window.partsData[p.id] = p; });

    count.textContent = parts.length + " مورد یافت شد";
    visiblePartCount = 0;

    if (!parts.length) {
      results.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:38px 12px;color:var(--muted)">قطعه‌ای با این مشخصات یافت نشد.</div>';
      return;
    }

    results.innerHTML = "";
    renderMoreParts();
  } catch (e) {
    if (e.name === "AbortError") return;
    results.innerHTML = `<div style="grid-column:1/-1;color:var(--danger);padding:20px 0">خطا: ${escapeHtml(e.message)}</div>`;
  }
}

function renderMoreParts() {
  const nextCount = Math.min(visiblePartCount + PARTS_PER_BATCH(), currentParts.length);
  const fragment = document.createDocumentFragment();
  const q = search.value.trim();

  for (let i = visiblePartCount; i < nextCount; i++) {
    const p = currentParts[i];
    const isAvailable = !!(p.stock && p.stock >= 1);
    const formattedPrice = p.price ? Number(p.price).toLocaleString('fa-IR') + ' تومان' : 'ثبت نشده';
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `
      <div class="card-header">
        <div class="card-header-right">
          <span class="status-dot ${isAvailable ? '' : 'off'}" title="${isAvailable ? 'موجود' : 'ناموجود'}"></span>
          <div class="card-title">${highlight(p.name, q)}</div>
        </div>
        <div class="stock-tag">موجودی: <b>${escapeHtml(p.stock ?? 0)}</b></div>
      </div>

      <div class="part-number-row">
        ${p.is_genuine ? '<span class="badge-genuine">Genuine</span>' : ''}
        <span class="part-number">${highlight(p.part_number, q)}</span>
      </div>

      <div class="cars-row-container">
        <div class="cars-list">
          <b>خودروها:</b>
          ${p.compatible_cars
            ? p.compatible_cars.split(/[،,]/).map(c => `<span class="car-chip">${highlight(c.trim(), q)}</span>`).join('')
            : 'نامشخص'}
        </div>
        <button class="accordion-btn" title="مشاهده جزئیات قیمت و تاریخ" onclick="toggleAccordion(${p.id}, this)">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>

      <div id="details-${p.id}" class="details-panel">
        <div class="details-panel-wrapper">
          <div class="details-content-box">
            <div class="details-item">
              <span>قیمت قطعه:</span>
              <span class="val">${escapeHtml(formattedPrice)}</span>
            </div>
            <div class="details-item">
              <span>آخرین تغییر قیمت:</span>
              <span class="val">${escapeHtml(formatDate(p.price_updated_at))}</span>
            </div>
            <div class="details-item">
              <span>ویرایش‌کننده:</span>
              <span class="val">${escapeHtml(p.last_updated_by || 'نامشخص')}</span>
            </div>
          </div>
        </div>
      </div>

      <div class="card-actions">
        <button class="btn-sm btn-stock" onclick="changeStock(${p.id})">
          <svg class="icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
          موجودی
        </button>
        <button class="btn-sm btn-price" onclick="openPriceModal(${p.id})">
          <svg class="icon" viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          قیمت
        </button>
        <button class="btn-sm btn-edit" onclick="openEditModal(${p.id})">
          <svg class="icon" viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          ویرایش
        </button>
        <button class="btn-sm btn-delete" onclick="deletePart(${p.id})">
          <svg class="icon" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          حذف
        </button>
      </div>
    `;
    fragment.appendChild(card);
  }

  visiblePartCount = nextCount;
  results.appendChild(fragment);
  updateLoadMoreButton();
}

function updateLoadMoreButton() {
  const old = document.getElementById("loadMoreWrap");
  if (old) old.remove();
  if (visiblePartCount >= currentParts.length) return;

  const wrap = document.createElement("div");
  wrap.id = "loadMoreWrap";
  wrap.className = "load-more-wrap";
  wrap.innerHTML = `
    <div>
      <button class="load-more-btn" type="button" onclick="renderMoreParts()">
        نمایش ${Math.min(PARTS_PER_BATCH(), currentParts.length - visiblePartCount)} قطعه بعدی
      </button>
      <div class="load-more-meta">نمایش ${visiblePartCount} از ${currentParts.length}</div>
    </div>`;
  results.appendChild(wrap);
}
function toggleAccordion(id, btn) {
  const panel = document.getElementById(`details-${id}`);
  if (!panel) return;
  panel.classList.toggle("open");
  btn.classList.toggle("active");
}

async function addPart() {
  const nameEl = document.getElementById("addName");
  const numEl = document.getElementById("addPartNum");
  const err = document.getElementById("addError");
  err.textContent = "";

  let isValid = true;
  if (!nameEl.value.trim()) { nameEl.classList.add("input-error"); isValid = false; }
  if (!numEl.value.trim()) { numEl.classList.add("input-error"); isValid = false; }
  if (!isValid) return;

  try {
    await api("/api/parts", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        name: nameEl.value.trim(),
        part_number: numEl.value.trim().toUpperCase(),
        compatible_cars: document.getElementById("addCars").value.trim(),
        stock: parseInt(document.getElementById("addStock").value || "0"),
        price: getRawPrice(document.getElementById("addPrice")),
        is_genuine: document.getElementById("addGenuine").checked
      })
    });
    closeModal("addModal");
    loadParts();
  } catch (e) { err.textContent = e.message; }
}

function openEditModal(id) {
  const p = window.partsData[id];
  document.getElementById("editId").value = p.id;
  document.getElementById("editName").value = p.name;
  document.getElementById("editPartNum").value = p.part_number;
  document.getElementById("editCars").value = p.compatible_cars || "";
  document.getElementById("editStock").value = p.stock ?? 0;
  setFormattedPrice(document.getElementById("editPrice"), p.price ?? 0);
  document.getElementById("editGenuine").checked = !!p.is_genuine;
  clearErrors('editModal');
  showModal("editModal");
}

async function saveEdit() {
  const id = document.getElementById("editId").value;
  const nameEl = document.getElementById("editName");
  const numEl = document.getElementById("editPartNum");
  const err = document.getElementById("editError");

  let isValid = true;
  if (!nameEl.value.trim()) { nameEl.classList.add("input-error"); isValid = false; }
  if (!numEl.value.trim()) { numEl.classList.add("input-error"); isValid = false; }
  if (!isValid) return;

  try {
    await api(`/api/parts/${id}`, {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        name: nameEl.value.trim(),
        part_number: numEl.value.trim().toUpperCase(),
        compatible_cars: document.getElementById("editCars").value.trim(),
        stock: parseInt(document.getElementById("editStock").value || "0"),
        price: getRawPrice(document.getElementById("editPrice")),
        is_genuine: document.getElementById("editGenuine").checked
      })
    });
    closeModal("editModal");
    loadParts();
  } catch (e) { err.textContent = e.message; }
}

async function deletePart(id) {
  if (!confirm("آیا از حذف این قطعه مطمئن هستید؟")) return;
  try {
    await api(`/api/parts/${id}`, { method: "DELETE" });
    loadParts();
  } catch (e) { alert(e.message); }
}

async function changeStock(id) {
  const p = window.partsData[id];
  const val = prompt(`موجودی جدید برای ${p.name}:`, p.stock);
  if (val === null) return;
  try {
    await api(`/api/parts/${id}/stock`, {
      method: "PATCH",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ stock: parseInt(val || "0") })
    });
    loadParts();
  } catch (e) { alert(e.message); }
}

function formatDate(dateStr) {
  if (!dateStr) return 'ثبت نشده';
  try {
    const d = new Date(dateStr);
    if (isNaN(d.getTime())) return dateStr;
    return d.toLocaleDateString('fa-IR');
  } catch (_) { return dateStr; }
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[ch]));
}

function escapeRegExp(string) {
  return String(string).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlight(text, q) {
  const safe = escapeHtml(text);
  if (!safe || !q) return safe;
  const words = q.trim().split(/\s+/).filter(Boolean).map(escapeRegExp);
  if (!words.length) return safe;
  const reg = new RegExp("(" + words.join("|") + ")", "gi");
  return safe.replace(reg, "<mark>$1</mark>");
}

  }
